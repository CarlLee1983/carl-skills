interface:
  display_name: "Design Experience"
  short_description: "以產品設計師的角色，從主題、既有功能、不滿意的現有介面，或帶來的目標稿與參考網站出發，訪談釐清風格或問題、比較方向與原型，收斂成可交給開發者的定稿與交接"
  default_prompt: "使用 $design-experience 擔任這個專案的產品設計師：判斷該從主題、既有介面開始，或診斷並改善我不滿意的現有設計；我附上的 UI 圖或喜歡的網站，請判斷是要做成這樣的目標稿，還是只借屬性的參考網站。釐清風格與主要流程，提出可比較的設計方向並建立原型，依我的回饋收斂與定稿。"
