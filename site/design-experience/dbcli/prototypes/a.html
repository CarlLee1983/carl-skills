<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A 時間軸重播｜dbcli 稽核審查原型</title>
<style>
/* 結構比較用的中性樣式：灰階加一個強調色，視覺語言留到選定結構之後。 */
:root {
  --bg: #f4f4f5; --surface: #ffffff; --surface-2: #fafafa; --ink: #18181b; --muted: #5f5f68; --faint: #8b8b94;
  --line: #e4e4e7; --line-2: #d4d4d8; --accent: #2b59c3; --accent-soft: #eef2fc; --accent-ink: #ffffff;
  --warn: #9a5b00; --warn-soft: #fff5e1; --bad: #b42318; --bad-soft: #fdecea; --ok: #1f7a4d; --ok-soft: #e7f5ee;
  --info: #3d5a80; --info-soft: #edf2f8;
  --font: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --fs: 14px; --lh: 1.5; --radius: 6px; --gap: 12px; --shadow: none; --ic-stroke: 2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: var(--fs); line-height: var(--lh); color: var(--ink); background: var(--bg); overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; stroke-width: var(--ic-stroke); vertical-align: -3px; }
.ic.lg { width: 20px; height: 20px; }
.ic.sm { width: 14px; height: 14px; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sample { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); border: 1px solid #f0d9a8; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); min-height: 34px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(.95); }
.btn.ghost { border-color: transparent; background: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.k-write { color: var(--warn); } .k-gate { color: var(--info); } .k-fail { color: var(--bad); } .k-protect { color: var(--ok); } .k-export { color: var(--info); } .k-read, .k-dryrun { color: var(--faint); }
.conn { font-family: var(--mono); font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); white-space: nowrap; }
.conn.prod { border-color: #c9b2e8; background: #f6f0fd; color: #5b2b97; }
.conn.staging { border-color: var(--line-2); background: var(--surface-2); color: var(--muted); }
pre.sql { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 16px; margin: 0; }
.top .meta { color: var(--muted); font-size: 13px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; gap: 0; min-height: calc(100vh - 54px); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 16px; }
.rail h2 { font-size: 12px; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.rail h2:first-child { margin-top: 0; }
.rail label { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.rail .count { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.rail input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); }
.stream { padding: 0 0 40px; min-width: 0; }
.seg { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 20px 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
.seg b { color: var(--ink); }
.row { display: grid; grid-template-columns: 64px 18px 72px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
.row:hover { background: var(--surface); }
.row[aria-selected=true] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.row .cmd { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cmd b { font-weight: 600; }
.row .res { font-size: 12px; white-space: nowrap; }
.row.dim .cmd { color: var(--muted); }
.row.pair { padding-left: 34px; }
.detail { border-left: 1px solid var(--line); background: var(--surface); padding: 18px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
.detail h2 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.detail section { margin-top: 16px; }
.detail h3 { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.ctx { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); }
.ctx li { display: flex; gap: 8px; padding: 5px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
.ctx li:last-child { border-bottom: 0; }
.ctx li.cur { background: var(--accent-soft); font-weight: 600; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.filtersbtn { display: none; }
@media (max-width: 1100px) { .layout { grid-template-columns: 200px minmax(0, 1fr); } .detail { grid-column: 1 / -1; position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); } }
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail.open { display: block; }
  .filtersbtn { display: inline-flex; }
  .row { grid-template-columns: 54px 16px minmax(0, 1fr) auto; padding: 8px 16px; }
  .row .c { display: none; }
  .seg { padding: 8px 16px 6px; }
  .detail { padding: 16px; }
}
</style>
</head>
<body>
<header class="top">
  <h1>代理工作紀錄</h1>
  <span class="sample">示例資料</span>
  <span class="meta" id="meta"></span>
  <button class="btn filtersbtn" id="filtersbtn" aria-expanded="false" aria-controls="rail">篩選</button>
</header>
<div class="layout">
  <aside class="rail" id="rail" aria-label="篩選">
    <h2>連線</h2><div id="f-conn"></div>
    <h2>類型</h2><div id="f-kind"></div>
    <h2>對象</h2><input type="search" id="q" placeholder="表名，例如 orders" aria-label="依對象搜尋">
  </aside>
  <main class="stream" id="stream" role="listbox" aria-label="依時間排列的紀錄"></main>
  <aside class="detail" id="detail" aria-live="polite"></aside>
</div>

function hhmm(ts, sec) {
  var d = new Date(ts);
  var h = (d.getUTCHours() + 8) % 24, m = d.getUTCMinutes(), s = d.getUTCSeconds();

}
function kindOf(e) {

  if (!e.success) return 'fail';
  if (e.side_effect_tier === 'db-write') return 'write';
  if (e.side_effect_tier === 'dry-run') return 'dryrun';
  if (m.securityNotification) return 'protect';
  if (e.command === 'export') return 'export';
  return 'read';
}
var KIND_LABEL = { write: '寫入資料', gate: '閘門決定', fail: '失敗', protect: '保護生效', export: '匯出到檔案', dryrun: '預演', read: '讀取' };

/* 「需要你看」的件：同連線、同對象、同一段遮罩 SQL、時間相連的寫入合成一件。 */
function buildItems(entries) {
  var items = [];
  var order = { fail: 0, gate: 1, write: 2, protect: 3, export: 4 };
  entries.forEach(function (e) {
    var k = kindOf(e);
    if (!(k in order)) return;
    var last = items[items.length - 1];
    if (k === 'write' && last && last.kind === 'write' && last.entries[0].redacted_sql === e.redacted_sql && last.entries[0].connection === e.connection && !(last.entries[0].metadata || {}).write_gate_outcome) {
      last.entries.push(e);
      return;
    }
    items.push({ id: 'it-' + e.id.slice(0, 8), kind: k, entries: [e] });
  });
  items.forEach(function (it) {
    var e = it.entries[0], m = e.metadata || {};
    var n = it.entries.length;
    var rows = it.entries.reduce(function (s, x) { return s + ((x.metadata || {}).rows_affected || 0); }, 0);
    it.conn = e.connection;
    it.target = targetLabel(e);
    it.when = n > 1 ? hhmm(e.ts) + '–' + hhmm(it.entries[n - 1].ts) : hhmm(e.ts, true);
    if (it.kind === 'write') {
      var verb = (e.redacted_sql || '').split(' ')[0];
      it.title = n > 1 ? n + ' 次批次 ' + verb : (e.command === 'migrate' ? '結構變更 ' + verb + ' TABLE' : verb + ' 已執行');
      it.sub = rows ? '共影響 ' + fmtN(rows) + ' 列' : '結構變更，無列數';
      it.why = n > 1 ? '同一段遮罩後的 SQL 在 ' + it.when + ' 執行了 ' + n + ' 次，合起來看才看得出總影響。' : (e.command === 'migrate' ? '這筆改了資料表結構；同一個指令先預演、再加 --execute 執行。' : '這筆確實改了資料。');
    } else if (it.kind === 'gate') {
      it.title = (m.write_gate_outcome === 'refused' ? '寫入被閘門擋下' : '寫入經確認後放行');
      it.sub = REASON_LABEL[m.write_gate_reason] || m.write_gate_reason;
      it.why = m.write_gate_outcome === 'refused' ? '代理送出一筆會影響整張表的 UPDATE，沒有人可以確認，所以閘門拒絕；資料沒有被改。' : '閘門判定這筆屬第二層風險，有人在終端機確認後才執行。確認的是誰，紀錄裡沒有。';
    } else if (it.kind === 'fail') {
      it.title = e.error_code === 'PERMISSION_DENIED' ? '寫入被權限拒絕' : '指令失敗';
      it.sub = e.error;
      it.why = e.error_code === 'PERMISSION_DENIED' ? '代理試著寫入唯讀的 prod。權限擋下了，資料沒有被改；但代理為何嘗試，值得問一句。' : '這筆失敗沒有改動資料；下一筆同類指令是否成功，見下方「之後」。';
    } else if (it.kind === 'protect') {
      it.title = '黑名單欄位已隱藏';
      it.sub = m.securityNotification;
      it.why = '查詢碰到受保護欄位，結果交給代理前已經移除。這是保護生效，不是問題；列在這裡讓你確認範圍符合預期。';
    } else if (it.kind === 'export') {
      it.title = '查詢結果匯出到檔案';
      it.sub = fmtN(m.rows) + ' 列，CSV';
      it.why = '資料離開資料庫、落到檔案。紀錄看得到列數與格式，看不到檔案路徑（已遮罩）。';
    }
    // 失敗之後，同指令同對象的下一筆
    if (it.kind === 'fail') {
      var idx = entries.indexOf(e);
      var next = entries.slice(idx + 1).filter(function (x) { return x.command === e.command && x.target === e.target && x.connection === e.connection; })[0];
      it.after = next || null;
    }
  });
  return items;
}

function readSummary(entries) {
  var map = {};
  entries.forEach(function (e) {
    if (kindOf(e) !== 'read') return;
    var key = e.connection + '\u0000' + targetLabel(e);
    if (!map[key]) map[key] = { conn: e.connection, target: targetLabel(e), count: 0, commands: {} };
    map[key].count++;
    map[key].commands[e.command] = true;
  });
  return Object.keys(map).map(function (k) { var v = map[k]; v.commands = Object.keys(v.commands); return v; })
    .sort(function (a, b) { return b.count - a.count; });
}

function countKinds(entries) {
  var c = { read: 0, dryrun: 0, write: 0, gate: 0, fail: 0, protect: 0, export: 0 };
  entries.forEach(function (e) { c[kindOf(e)]++; });
  return c;
}

  if (ev.target.closest('#reset')) { Object.keys(state.kinds).forEach(function (k) { state.kinds[k] = true; }); state.conns = { staging: true, prod: true }; state.q = ''; document.getElementById('q').value = ''; render(); }
  if (ev.target.closest('#filtersbtn')) { var rail = document.getElementById('rail'); var open = rail.classList.toggle('open'); ev.target.closest('#filtersbtn').setAttribute('aria-expanded', open); }
});
render();
</script>
</body>
</html>
