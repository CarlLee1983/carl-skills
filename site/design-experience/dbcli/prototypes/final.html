<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稽核審查 v1（B＋處理 1）｜dbcli 原型</title>
<style>
/* 結構比較用的中性樣式：灰階加一個強調色，視覺語言留到選定結構之後。 */
:root {
  --bg: #f4f4f5; --surface: #ffffff; --surface-2: #fafafa; --ink: #18181b; --muted: #5f5f68; --faint: #8b8b94;
  --line: #e4e4e7; --line-2: #d4d4d8; --accent: #2b59c3; --accent-soft: #eef2fc; --accent-ink: #ffffff;
  --warn: #9a5b00; --warn-soft: #fff5e1; --bad: #b42318; --bad-soft: #fdecea; --ok: #1f7a4d; --ok-soft: #e7f5ee;
  --info: #3d5a80; --info-soft: #edf2f8;
  --font: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --fs: 14px; --lh: 1.5; --radius: 6px; --gap: 12px; --shadow: none; --ic-stroke: 2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: var(--fs); line-height: var(--lh); color: var(--ink); background: var(--bg); overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; stroke-width: var(--ic-stroke); vertical-align: -3px; }
.ic.lg { width: 20px; height: 20px; }
.ic.sm { width: 14px; height: 14px; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sample { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); border: 1px solid #f0d9a8; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); min-height: 34px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(.95); }
.btn.ghost { border-color: transparent; background: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.k-write { color: var(--warn); } .k-gate { color: var(--info); } .k-fail { color: var(--bad); } .k-protect { color: var(--ok); } .k-export { color: var(--info); } .k-read, .k-dryrun { color: var(--faint); }
.conn { font-family: var(--mono); font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); white-space: nowrap; }
.conn.prod { border-color: #c9b2e8; background: #f6f0fd; color: #5b2b97; }
.conn.staging { border-color: var(--line-2); background: var(--surface-2); color: var(--muted); }
pre.sql { margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }

/* 結構 B：待審清單。版面只寫一次；body[data-t] 切換視覺處理。 */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: none; }
.top h1 { font-size: 16px; margin: 0; }
.top .meta { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 20px 48px; }
.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
.summary p { margin: 0; font-size: 15px; flex: 1 1 420px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--radius); border: 1px solid; margin-bottom: 14px; }
.banner.warn { background: var(--warn-soft); border-color: #ecd29b; }
.banner.info { background: var(--info-soft); border-color: #c9d6e6; }
.banner p { margin: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.queue-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.queue-head h2 { font-size: 14px; margin: 0; }
.progress { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { width: 80px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.group-h { font-size: 12px; color: var(--muted); padding: 10px 14px 4px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 10px; width: 100%; text-align: left; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; }
.item:hover { background: var(--surface-2); }
.item[aria-current=true] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .ttl { font-weight: 600; min-width: 0; }
.item .sub { grid-column: 2 / 3; color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.item .why { display: none; grid-column: 2 / 4; font-size: 13px; }
.item .st { font-size: 12px; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; color: var(--faint); }
.item .st.done { color: var(--ok); }
.item.done .ttl { color: var(--muted); }
.item .where { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.reads { padding: 0 0 6px; }
.reads summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 8px; align-items: center; list-style: none; }
.reads summary::-webkit-details-marker { display: none; }
.reads[open] summary .chev { transform: rotate(90deg); }
.reads ul { list-style: none; margin: 0; padding: 0 14px 8px 36px; }
.reads li { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.reads li .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.detail { padding: 18px; position: sticky; top: 14px; }
.detail .eyebrow { font-size: 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.detail h2 { font-size: 18px; margin: 4px 0 6px; }
.detail .whybox { margin: 0 0 14px; color: var(--ink); }
.detail section { margin-top: 16px; }
.detail h3 { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.members { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); }
.members li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
.members li:first-child { border-top: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cmdline { display: flex; gap: 6px; align-items: stretch; }
.cmdline pre { flex: 1; min-width: 0; }
.note { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); resize: vertical; }
.backbtn { display: none; }
table.all { width: 100%; border-collapse: collapse; font-size: 13px; }
table.all th, table.all td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.all th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
table.all td.t { font-family: var(--mono); font-size: 12px; white-space: nowrap; color: var(--muted); }
table.all tr.hot td { background: #fffdf6; }
.tablebar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.tablebar input, .tablebar select { padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); min-height: 34px; }
.tablescroll { overflow-x: auto; }
.state { text-align: center; padding: 56px 24px; }
.state > .ic { width: 32px; height: 32px; color: var(--faint); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.state h2 { font-size: 17px; margin: 10px 0 6px; }
.state p { margin: 0 auto 12px; max-width: 520px; color: var(--muted); }
.state pre { display: inline-block; text-align: left; }
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(15, 23, 42, .35); }
dialog .dh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
dialog .dh h2 { font-size: 15px; margin: 0; flex: 1; }
dialog .db { padding: 14px 16px; max-height: 60vh; overflow: auto; }
dialog .df { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.demo { font-size: 12px; color: var(--warn); display: inline-flex; gap: 4px; align-items: center; }
.scen { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.scen select { padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); }

/* 處理 1：報表同源（沿用 src/ui-template 的 Tailwind 設定與 .card／.btn-primary） */
body[data-t="1"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f8fafc; --ink: #1e293b; --muted: #64748b; --faint: #94a3b8;
  --line: #e2e8f0; --line-2: #cbd5e1; --accent: #2563eb; --accent-soft: #eff6ff;
  --warn: #b45309; --warn-soft: #fffbeb; --bad: #dc2626; --bad-soft: #fef2f2; --ok: #059669; --ok-soft: #ecfdf5; --info: #0369a1; --info-soft: #f0f9ff;
  --font: Inter, system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
  --fs: 14px; --lh: 1.5; --radius: 12px; --ic-stroke: 2;
  --shadow: 0 2px 15px -3px rgba(0,0,0,.07), 0 4px 6px -2px rgba(0,0,0,.05);
}
body[data-t="1"] .top { background: rgba(255,255,255,.85); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5; }
body[data-t="1"] .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; }
body[data-t="1"] .top h1 { font-weight: 700; letter-spacing: -.01em; }
body[data-t="1"] .btn { border-radius: 8px; font-weight: 500; }
body[data-t="1"] .btn.primary { background: #2563eb; }
body[data-t="1"] .btn.primary:hover { background: #1d4ed8; filter: none; }
body[data-t="1"] .group-h, body[data-t="1"] .detail h3 { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
body[data-t="1"] .item .sub, body[data-t="1"] .members .n { font-variant-numeric: tabular-nums; }
body[data-t="1"] .chip { border-radius: 999px; background: #f1f5f9; border-color: transparent; color: #475569; font-weight: 500; }
body[data-t="1"] .chip.hot { background: #fffbeb; color: #b45309; }
body[data-t="1"] .chip.bad { background: #fef2f2; color: #dc2626; }
body[data-t="1"] .banner { border-radius: 12px; }
body[data-t="1"] .banner.warn { border-color: #fcd34d; }
body[data-t="1"] .banner.info { background: #f0f9ff; border-color: #bae6fd; }
body[data-t="1"] .detail { border-left: 4px solid var(--accent); }
body[data-t="1"] .detail.k-fail-edge { border-left-color: #dc2626; }
body[data-t="1"] .detail.k-gate-edge { border-left-color: #0369a1; }
body[data-t="1"] .detail.k-protect-edge { border-left-color: #059669; }
body[data-t="1"] .detail.k-write-edge { border-left-color: #d97706; }
body[data-t="1"] pre.sql { background: #0f172a; color: #e2e8f0; border-color: #0f172a; border-radius: 8px; }
body[data-t="1"] .item .ttl { font-weight: 600; color: #0f172a; }
body[data-t="1"] table.all tr.hot td { background: #fffbeb; }

/* 處理 2：指南紙本（沿用 docs/assets/dbcli-guides.css 的變數與按鈕） */
body[data-t="2"] {
  --bg: #fffaf3; --surface: #ffffff; --surface-2: #fffaf3; --ink: #28231f; --muted: #716a63; --faint: #a39a90;
  --line: #e9dfd3; --line-2: #dccfbf; --accent: #a94322; --accent-soft: #fff0df;
  --warn: #a94322; --warn-soft: #fff0df; --bad: #a3261b; --bad-soft: #fde9e4; --ok: #28745a; --ok-soft: #e4f3ec; --info: #45649d; --info-soft: #edf3ff;
  --font: Inter, 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
  --fs: 15px; --lh: 1.7; --radius: 14px; --ic-stroke: 1.75; --shadow: none;
}
body[data-t="2"] .top { background: rgba(255,250,243,.94); padding: 14px 24px; min-height: 64px; }
body[data-t="2"] .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: #fff; }
body[data-t="2"] .top h1 { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
body[data-t="2"] .wrap { max-width: 1180px; padding: 28px 24px 64px; }
body[data-t="2"] .summary p { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.45; }
body[data-t="2"] .btn { border-radius: 999px; padding: 8px 18px; min-height: 42px; font-weight: 750; box-shadow: 0 4px 0 rgba(40,35,31,.07); }
body[data-t="2"] .btn.primary { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 0 rgba(117,47,26,.2); }
body[data-t="2"] .btn.primary:hover { background: #8d351b; filter: none; }
body[data-t="2"] .btn.ghost { box-shadow: none; }
body[data-t="2"] .group-h, body[data-t="2"] .detail .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .11em; }
body[data-t="2"] .item { padding: 16px 18px; gap: 6px 12px; }
body[data-t="2"] .item .ttl { font-size: 16px; font-weight: 750; }
body[data-t="2"] .item .why { display: block; color: var(--muted); }
body[data-t="2"] .item[aria-current=true] { box-shadow: inset 4px 0 0 var(--accent); }
body[data-t="2"] .detail { padding: 24px 26px; }
body[data-t="2"] .detail h2 { font-size: 24px; font-weight: 800; letter-spacing: -.025em; line-height: 1.25; }
body[data-t="2"] .detail .whybox { font-size: 16px; }
body[data-t="2"] .detail h3 { font-size: 13px; font-weight: 800; color: var(--ink); }
body[data-t="2"] .chip { background: var(--surface); border-color: var(--line); }
body[data-t="2"] .chip.hot { background: var(--accent-soft); color: var(--accent); border-color: #f1d3b6; }
body[data-t="2"] .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: #f2c7bd; }
body[data-t="2"] pre.sql { background: #fffaf3; border-color: var(--line); border-radius: 10px; }
body[data-t="2"] .tab[aria-selected=true] { border-bottom-width: 3px; }
body[data-t="2"] .conn.prod { background: #edf3ff; color: #45649d; border-color: #c8d6f0; }

@media (max-width: 960px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
}
@media (max-width: 720px) {
  .wrap, body[data-t="2"] .wrap { padding: 14px 16px 40px; }
  .top, body[data-t="2"] .top { padding: 10px 16px; }
  .top .meta { flex-basis: 100%; }
  .summary p { flex-basis: 100%; }
  body[data-t="2"] .summary p { font-size: 17px; }
  body.has-sheet .grid > .queue, body.has-sheet #summary, body.has-sheet #tabs, body.has-sheet #banners { display: none; }
  body:not(.has-sheet) .grid > .detail.sheet { display: none; }
  .backbtn { display: inline-flex; margin: -4px 0 10px -6px; }
  .members li { grid-template-columns: 60px minmax(0, 1fr); }
  .members li .n { grid-column: 2; }
  .detail, body[data-t="2"] .detail { padding: 16px; }
}

.scenbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 20px; background: var(--warn-soft); border-bottom: 1px solid #fcd34d; font-size: 12px; color: var(--warn); }
.scenbar p { margin: 0; flex: 1 1 320px; }
@media (max-width: 720px) { .scenbar { padding: 8px 16px; } }
</style>
</head>
<body data-t="1">
<div class="scenbar" role="note">
  <p>原型 v1・所有紀錄都是示例資料；已審、註記、匯出只在這個頁面裡模擬，不寫入任何檔案或資料庫。</p>
  <label class="scen" for="scen">示範情境
    <select id="scen">
      <option value="normal">正常</option>

      <option value="empty">期間內沒有紀錄</option>
      <option value="disabled">稽核未開啟</option>
    </select>
  </label>
</div>
<header class="top">
  <div class="brand"><span class="brand-mark" id="mark"></span><h1>稽核審查</h1></div>
  <span class="sample">示例資料</span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button class="btn" id="exportbtn" data-act="export"></button>
</header>
<div class="wrap">
  <div id="banners"></div>
  <div class="summary" id="summary"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel" role="tabpanel"></div>
</div>
<dialog id="exportdlg" aria-labelledby="exph">

</dialog>

    if (k === 'write' && last && last.kind === 'write' && last.entries[0].redacted_sql === e.redacted_sql && last.entries[0].connection === e.connection && !(last.entries[0].metadata || {}).write_gate_outcome) {
      last.entries.push(e);
      return;
    }
    items.push({ id: 'it-' + e.id.slice(0, 8), kind: k, entries: [e] });
  });
  items.forEach(function (it) {
    var e = it.entries[0], m = e.metadata || {};
    var n = it.entries.length;
    var rows = it.entries.reduce(function (s, x) { return s + ((x.metadata || {}).rows_affected || 0); }, 0);
    it.conn = e.connection;
    it.target = targetLabel(e);
    it.when = n > 1 ? hhmm(e.ts) + '–' + hhmm(it.entries[n - 1].ts) : hhmm(e.ts, true);
    if (it.kind === 'write') {
      var verb = (e.redacted_sql || '').split(' ')[0];
      it.title = n > 1 ? n + ' 次批次 ' + verb : (e.command === 'migrate' ? '結構變更 ' + verb + ' TABLE' : verb + ' 已執行');
      it.sub = rows ? '共影響 ' + fmtN(rows) + ' 列' : '結構變更，無列數';
      it.why = n > 1 ? '同一段遮罩後的 SQL 在 ' + it.when + ' 執行了 ' + n + ' 次，合起來看才看得出總影響。' : (e.command === 'migrate' ? '這筆改了資料表結構；同一個指令先預演、再加 --execute 執行。' : '這筆確實改了資料。');
    } else if (it.kind === 'gate') {
      it.title = (m.write_gate_outcome === 'refused' ? '寫入被閘門擋下' : '寫入經確認後放行');
      it.sub = REASON_LABEL[m.write_gate_reason] || m.write_gate_reason;
      it.why = m.write_gate_outcome === 'refused' ? '代理送出一筆會影響整張表的 UPDATE，沒有人可以確認，所以閘門拒絕；資料沒有被改。' : '閘門判定這筆屬第二層風險，有人在終端機確認後才執行。確認的是誰，紀錄裡沒有。';
    } else if (it.kind === 'fail') {
      it.title = e.error_code === 'PERMISSION_DENIED' ? '寫入被權限拒絕' : '指令失敗';
      it.sub = e.error;
      it.why = e.error_code === 'PERMISSION_DENIED' ? '代理試著寫入唯讀的 prod。權限擋下了，資料沒有被改；但代理為何嘗試，值得問一句。' : '這筆失敗沒有改動資料；下一筆同類指令是否成功，見下方「之後」。';
    } else if (it.kind === 'protect') {
      it.title = '黑名單欄位已隱藏';
      it.sub = m.securityNotification;
      it.why = '查詢碰到受保護欄位，結果交給代理前已經移除。這是保護生效，不是問題；列在這裡讓你確認範圍符合預期。';
    } else if (it.kind === 'export') {
      it.title = '查詢結果匯出到檔案';
      it.sub = fmtN(m.rows) + ' 列，CSV';
      it.why = '資料離開資料庫、落到檔案。紀錄看得到列數與格式，看不到檔案路徑（已遮罩）。';
    }
    // 失敗之後，同指令同對象的下一筆
    if (it.kind === 'fail') {
      var idx = entries.indexOf(e);
      var next = entries.slice(idx + 1).filter(function (x) { return x.command === e.command && x.target === e.target && x.connection === e.connection; })[0];
      it.after = next || null;
    }
  });
  return items;
}

function readSummary(entries) {
  var map = {};
  entries.forEach(function (e) {
    if (kindOf(e) !== 'read') return;
    var key = e.connection + '\u0000' + targetLabel(e);
    if (!map[key]) map[key] = { conn: e.connection, target: targetLabel(e), count: 0, commands: {} };
    map[key].count++;
    map[key].commands[e.command] = true;
  });
  return Object.keys(map).map(function (k) { var v = map[k]; v.commands = Object.keys(v.commands); return v; })
    .sort(function (a, b) { return b.count - a.count; });
}

  var c = { read: 0, dryrun: 0, write: 0, gate: 0, fail: 0, protect: 0, export: 0 };

  return c;
}

function renderState() {
  if (S.scen === 'disabled') return '<div class="card state" role="status">' + ic('settings-2') + '<h2>這兩條連線都沒有開啟稽核紀錄</h2><p>連線設定裡 <span class="mono">audit.enabled</span> 是 false，dbcli 不會留下紀錄，所以代理這段期間做了什麼無從審查。之後的工作要能審查，先把它改回 true（或移除這個設定）。</p>' + cmdBlock('dbcli audit health', '健康檢查指令') + '</div>';
  if (S.scen === 'empty') return '<div class="card state" role="status">' + ic('inbox') + '<h2>10/21 14:02–14:48 之間沒有紀錄</h2><p>稽核是開著的，只是這段期間沒有任何 dbcli 指令。代理可能用了其他連線，或時間範圍選錯了。</p><button class="btn" data-act="widen">' + ic('history', 'sm') + '改看最近 24 小時</button></div>';
  return null;
}
function render() {
  if (!S.sel) S.sel = firstItem().id;
  document.body.dataset.t = String(CFG.theme);
  renderHeader(); renderBanners(); renderSummary(); renderTabs();
  var panel = document.getElementById('panel');
  var st = renderState();
  if (st) { panel.innerHTML = st; document.body.classList.remove('has-sheet'); }
  else panel.innerHTML = S.tab === 'queue' ? '<div class="grid">' + renderQueue() + renderDetail() + '</div>' : renderAll();
  var exp = document.getElementById('exportbtn');
  if (exp) exp.disabled = !!st;
}
function select(id, focusDetail) {
  S.sel = id; render();
  var sheet = innerWidth <= 720;
  if (sheet) { document.body.classList.add('has-sheet'); window.scrollTo(0, 0); }
  var t = (focusDetail || sheet) ? document.getElementById('dtitle') : document.querySelector('.item[data-item="' + id + '"]');
  if (t) t.focus({ preventScroll: !sheet && !focusDetail });
}
function nextUnreviewed(fromId) {
  var list = orderedItems(), i = list.findIndex(function (x) { return x.id === fromId; });
  for (var j = 1; j <= list.length; j++) { var c = list[(i + j) % list.length]; if (!S.reviewed[c.id]) return c; }
  return null;
}
function summaryMarkdown() {
  var lines = ['# 稽核審查摘要（示例資料）', '', '- 期間：2026-10-21 ' + hhmm(META.range.from) + '–' + hhmm(META.range.to) + '（台北時間）',
    '- 連線：' + META.connections.map(function (c) { return c.name + '（' + c.permission + '）'; }).join('、'),
    '- 紀錄：' + ENTRIES.length + ' 筆；需要審查 ' + ITEMS.length + ' 件，已審 ' + nReviewed() + ' 件'];
  if (S.scen === 'partial') lines.push('- 注意：有 2 行紀錄無法解析，已略過');
  GROUPS.forEach(function (g) {
    var its = ITEMS.filter(function (x) { return x.kind === g.k; });
    if (!its.length) return;
    lines.push('', '## ' + g.label);
    its.forEach(function (it) {
      lines.push('- [' + (S.reviewed[it.id] ? 'x' : ' ') + '] ' + it.when + ' ' + it.conn + ' ' + it.target + '：' + it.title + '（' + it.sub + '）；紀錄 ' + it.entries.map(shortId).join(', '));
      if (S.notes[it.id]) lines.push('  - 註記：' + S.notes[it.id]);
    });
  });
  return lines.join('\n');
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-item],[data-tab],[data-act],[data-copy]');
  if (!t) return;
  if (t.dataset.copy) return copyText(t.dataset.copy, t.dataset.label);
  if (t.dataset.item) return select(t.dataset.item, t.classList.contains('ghost'));
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); document.getElementById('tab-' + S.tab).focus(); return; }
  var a = t.dataset.act;
  if (a === 'review') {
    S.reviewed[S.sel] = true;
    var n = nextUnreviewed(S.sel);
    if (n) { toast('已標記；換下一件'); select(n.id, true); }
    else { toast('全部審過了'); document.body.classList.remove('has-sheet'); render(); }
  }
  if (a === 'unreview') { delete S.reviewed[S.sel]; render(); }
  if (a === 'back') { document.body.classList.remove('has-sheet'); render(); var b = document.querySelector('[data-item="' + S.sel + '"]'); if (b) b.focus(); }
  if (a === 'clearf') { S.q = ''; S.kind = ''; S.conn = ''; render(); }
  if (a === 'widen') { S.scen = 'normal'; var sc = document.getElementById('scen'); if (sc) sc.value = 'normal'; toast('示範：改用原本的示例資料'); render(); }
  if (a === 'export') openExport();
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'fq') { S.q = ev.target.value; var pos = ev.target.selectionStart; render(); var f = document.getElementById('fq'); f.focus(); f.setSelectionRange(pos, pos); }
  if (ev.target.id === 'note') { S.notes[S.sel] = ev.target.value; }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'fk') { S.kind = ev.target.value; render(); document.getElementById('fk').focus(); }
  if (ev.target.id === 'fc') { S.conn = ev.target.value; render(); document.getElementById('fc').focus(); }
  if (ev.target.id === 'scen') { S.scen = ev.target.value; S.tab = 'queue'; render(); }
});
document.addEventListener('keydown', function (ev) {
  var cur = ev.target.closest && ev.target.closest('.item');
  if (!cur || (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp')) return;
  var all = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var i = all.indexOf(cur), n = all[i + (ev.key === 'ArrowDown' ? 1 : -1)];
  if (n) { ev.preventDefault(); n.focus(); }
});
function openExport() {
  var d = document.getElementById('exportdlg');
  if (!d) return;
  document.getElementById('md').textContent = summaryMarkdown();
  d.showModal();
}

document.getElementById('exportdlg').addEventListener('click', function (ev) {
  if (ev.target.closest('[data-close]')) this.close();
  if (ev.target.closest('#copymd')) copyText(document.getElementById('md').textContent, '審查摘要');
});
render();
</script>
</body>
</html>
