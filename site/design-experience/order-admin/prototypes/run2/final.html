<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定稿：C 處理佇列＋處理 1｜訂單（示例）</title>
<style>
/* 共用頁首與左側導覽：沿用現況，改善範圍不含這一塊 */
.lg-top { position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(#3b5f93, #2a4775); color: #fff; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 30; border-bottom: 1px solid #1d3354; }
.lg-logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; }
.lg-logo small { font-weight: normal; font-size: 12px; margin-left: 8px; opacity: .8; }
.lg-sample { font-size: 11px; background: #f6d860; color: #4a3b00; padding: 1px 6px; border-radius: 2px; }
.lg-user { margin-left: auto; font-size: 12px; }
.lg-user a { color: #cfe0ff; }
.lg-menu { display: none; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; }
.lg-nav { position: fixed; top: 46px; bottom: 0; left: 0; width: 168px; background: #e9edf3; border-right: 1px solid #c3cad6; padding-top: 8px; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 25; }
.lg-nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; color: #2b3a52; text-decoration: none; border-bottom: 1px solid #d8dee8; }
.lg-nav a.on { background: #fff; font-weight: bold; color: #1d4f91; border-left: 4px solid #1d4f91; padding-left: 10px; }
.lg-nav a:hover { background: #f7f9fc; }
.lg-glyph { width: 16px; text-align: center; font-size: 12px; }
.lg-main { margin-left: 168px; padding-top: 46px; min-height: 100vh; }
@media (max-width: 800px) {
  .lg-menu { display: block; }
  .lg-logo small, .lg-user { display: none; }
  .lg-nav { transform: translateX(-100%); transition: transform .2s; }
  .lg-nav-open .lg-nav { transform: none; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
  .lg-main { margin-left: 0; }
}

/* 方向比較用的中性樣式：結構先比，視覺語言留到選定方向之後 */
:root {
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #f4f5f7; --surface: #fff; --sunken: #f8f9fa;
  --line: #e1e4e8; --line-strong: #c8cdd3;
  --ink: #1f2933; --ink-2: #4b5563; --ink-3: #7b8592;
  --accent: #2459c4; --accent-ink: #fff; --accent-soft: #eaf0fb;
  --danger: #b42318;
  --radius: 6px; --fs: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pg { padding: 20px 24px 64px; max-width: 1400px; }
.crumb { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; margin-bottom: 4px; }
.crumb a { color: inherit; text-decoration: none; }
.crumb a:hover { color: var(--ink); text-decoration: underline; }
.crumb .ic { width: 14px; height: 14px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 650; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--danger); }
.lnk { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.lnk:hover { text-decoration: underline; }
.st { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--ink-2); }
.st .ic { width: 15px; height: 15px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.inp { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); width: 100%; }
textarea.inp { height: auto; padding: 8px 10px; min-height: 72px; resize: vertical; }
.inp:focus-visible { outline-offset: 0; }
.inp[aria-invalid=true] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; display: none; align-items: center; gap: 4px; margin: 0; }
.err.show { display: flex; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.idf { font-family: var(--mono); font-size: .93em; letter-spacing: -.01em; white-space: nowrap; }
.sample-note { color: var(--ink-3); font-size: 12px; margin-top: 16px; }

/* 表格：欄位順序沿用現況 */
.tbl-wrap { overflow-x: auto; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; min-width: 940px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 8px 8px; border-bottom: 1px solid var(--line-strong); background: var(--sunken); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 7px 8px; font-size: 13.5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: #fafbfc; }
.tbl td.op { white-space: nowrap; }
.tbl td.op .btn + .lnk { margin-left: 6px; }
.tbl td.op .btn, .tbl td.op .lnk { vertical-align: middle; }
.tbl td.nowrap { white-space: nowrap; }
.tbl td:nth-child(6) { min-width: 170px; }
.tbl input[type=checkbox] { width: 16px; height: 16px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; background: #1f2933; color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); transition: opacity .18s, transform .18s; z-index: 80; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast small { color: #b9c2cc; margin-left: 4px; white-space: nowrap; }
@media (max-width: 720px) {
  .pg { padding: 14px 16px 64px; }
  #toast { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.mode { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 2px; }
.mode button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; background: none; border-radius: 4px; cursor: pointer; color: var(--ink-2); }
.mode button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* 佇列選擇 */
.qsel { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.qtab { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "i n c" "i s c"; align-items: center; column-gap: 10px; min-width: 220px; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; }
.qtab .ic { grid-area: i; width: 22px; height: 22px; color: var(--ink-3); }
.qtab .q-name { grid-area: n; font-weight: 600; }
.qtab .q-sub { grid-area: s; font-size: 12.5px; color: var(--ink-3); }
.qtab .q-count { grid-area: c; font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
.qtab[aria-selected=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.qtab[aria-selected=true] .ic { color: var(--accent); }
.qtab.sel-q .q-count { font-size: 20px; }
.qsel-note { align-self: center; color: var(--ink-3); font-size: 13px; margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* 工作區：左佇列、右工作卡 */
.work { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.qlist-toggle { display: none; }
.qlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qlist-h { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 12.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); background: var(--sunken); }
.qi { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.qul { list-style: none; margin: 0; padding: 0; }
.qul li:last-child .qi { border-bottom: 0; }
.qi:hover { background: var(--sunken); }
.qi[aria-current=true] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.qi-id { font-weight: 600; }
.qi-age { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.qi-age.old { color: var(--danger); }
.qi-sub { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qi.done { color: var(--ink-3); }
.qi.done .qi-id { font-weight: 400; text-decoration: line-through; }
.qi.later .qi-age::after { content: "・稍後"; }
.qi-done-ic { color: var(--ink-3); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 820px; }
.card-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.card-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
.card-id { margin: 6px 0 2px; font-size: 22px; font-weight: 650; }
.card-age { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px; }
.card-body { padding: 16px 22px 20px; display: grid; gap: 18px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts .wide { grid-column: 1 / -1; }
.facts dt { font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }
.facts dd { margin: 0; }
.act { display: grid; gap: 12px; padding-top: 16px; border-top: 1px dashed var(--line-strong); }
.act-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; }
.hint { font-size: 12px; color: var(--ink-3); }
.act-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.act-row .lnk { margin-left: auto; }
.kbd-hint { margin: 0; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.claim { background: var(--sunken); border-radius: 6px; padding: 12px 14px; }
.claim h3 { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.claim blockquote { margin: 0 0 6px; font-size: 15px; }
.claim p { margin: 0; font-size: 13px; color: var(--ink-2); }
.done-line { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--sunken); border-radius: 6px; }
.empty { padding: 48px 24px; text-align: center; display: grid; justify-items: center; gap: 8px; }
.empty .ic { width: 36px; height: 36px; color: var(--accent); }
.empty h2 { margin: 0; font-size: 18px; }
.empty p { margin: 0 0 8px; color: var(--ink-2); }

/* 所有訂單 */
.tv-bar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); cursor: pointer; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip[aria-pressed=true] b { color: #fff; }
.search { position: relative; margin-left: auto; width: 260px; }
.search .ic { position: absolute; left: 10px; top: 10px; color: var(--ink-3); }
.search .inp { padding-left: 32px; }
.more { display: none; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; align-items: end; }
.more.show { display: flex; }
.more .inp { width: 160px; }
.tbl-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tbl-foot { padding: 8px 12px; color: var(--ink-3); font-size: 13px; background: var(--surface); border-top: 1px solid var(--line); }
.selbar { position: sticky; bottom: 12px; margin-top: 12px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--ink); color: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 10; }
.selbar.show { display: flex; }
.selbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.selbar .btn.primary { background: #fff; color: var(--ink); border-color: #fff; }
.selbar .btn.ghost { border-color: transparent; }
.selbar :focus-visible { outline-color: #fff; }
.empty-row td { text-align: center; padding: 32px; color: var(--ink-3); }

@media (max-width: 960px) {
  .work { grid-template-columns: 280px minmax(0, 1fr); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .pg-head { align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; }
  .crumb { display: none; }
  .qsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .qtab { min-width: 0; padding: 10px 12px; grid-template-columns: 1fr auto; grid-template-areas: "n c" "s c"; }
  .qtab .ic { display: none; }
  .qtab .q-count { font-size: 24px; }
  .qtab.sel-q { grid-column: 1 / -1; }
  .qsel-note { grid-column: 1 / -1; margin: 0; }
  .work { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .qlist-toggle { display: flex; order: 2; }
  .qlist-box { order: 3; display: none; }
  .qlist-box.open { display: block; }
  .card { order: 1; }
  .card-h { padding: 14px 16px 12px; }
  .card-body { padding: 14px 16px 16px; }
  .facts { grid-template-columns: 1fr 1fr; }
  .act-grid { grid-template-columns: 1fr; }
  .act-row .btn.primary { flex: 1 1 100%; justify-content: center; height: 42px; }
  .act-row .lnk { margin-left: 0; }
  .kbd-hint { display: none; }
  .search { width: 100%; margin-left: 0; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .chip { flex: none; }
}

/*@T1-START*/
/* 處理 1「調度台」：深色佇列軌道＋明亮工作面，等寬數字，訊號橘是唯一的主要動作色 */
body.t1 { --bg: #e6e9ed; --surface: #fff; --sunken: #f3f5f7; --line: #dde1e6; --line-strong: #b9c0c9; --ink: #111821; --ink-2: #3d4753; --ink-3: #6b7683; --accent: #d9480f; --accent-ink: #fff; --accent-soft: #fff1e8; --radius: 3px; --fs: 13px; --rail: #121a24; --rail-2: #1c2633; --rail-ink: #c3ccd6; --rail-dim: #7d8896; }
.t1 .ic { stroke-width: 1.5; }
.t1 h1 { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); }
.t1 .pg { padding-top: 16px; }
.t1 .pg-head { margin-bottom: 12px; align-items: center; }
.t1 .mode { border-radius: 3px; border-color: var(--line-strong); }
.t1 .mode button { border-radius: 2px; height: 28px; font-size: 12.5px; }
.t1 .mode button[aria-pressed=true] { background: var(--ink); color: #fff; }
.t1 .qsel { gap: 0; margin-bottom: 0; background: var(--rail); border-radius: 3px 3px 0 0; padding: 0 0 0 0; }
.t1 .qtab { background: transparent; border: 0; border-right: 1px solid #263243; border-radius: 0; color: var(--rail-ink); min-width: 230px; padding: 14px 18px; }
.t1 .qtab .ic { color: var(--rail-dim); }
.t1 .qtab .q-name { color: #fff; letter-spacing: .04em; }
.t1 .qtab .q-sub { color: var(--rail-dim); }
.t1 .qtab .q-count { font-family: var(--mono); font-size: 34px; font-weight: 600; color: #fff; }
.t1 .qtab[aria-selected=true] { box-shadow: inset 0 -3px 0 var(--accent); background: var(--rail-2); }
.t1 .qtab[aria-selected=true] .ic { color: var(--accent); }
.t1 .qtab:focus-visible, .t1 .qi:focus-visible { outline-color: #ff8a4c; outline-offset: -3px; }
.t1 .qsel-note { color: var(--rail-dim); padding-right: 18px; }
.t1 .work { gap: 0; grid-template-columns: 360px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-top: 0; }
.t1 .qlist-box { background: var(--rail); align-self: stretch; }
.t1 .qlist { background: transparent; border: 0; border-radius: 0; }
.t1 .qlist-h { background: transparent; border-color: #263243; color: var(--rail-dim); letter-spacing: .04em; }
.t1 .qi { border-color: #223042; color: var(--rail-ink); padding: 9px 16px; }
.t1 .qi:hover { background: var(--rail-2); }
.t1 .qi[aria-current=true] { background: var(--rail-2); box-shadow: inset 4px 0 0 var(--accent); }
.t1 .qi-id { font-family: var(--mono); color: #fff; font-weight: 500; }
.t1 .qi-sub { color: var(--rail-dim); }
.t1 .qi-age { color: var(--rail-dim); font-variant-numeric: tabular-nums; }
.t1 .qi-age.old { color: #ff8a4c; }
.t1 .qi.done .qi-id { color: var(--rail-dim); }
.t1 .card { border: 0; border-radius: 0; max-width: none; }
.t1 .card-h { padding: 18px 28px 14px; display: grid; grid-template-columns: 1fr auto; align-items: end; }
.t1 .card-meta { grid-column: 1 / -1; }
.t1 .card-id { font-family: var(--mono); font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 4px 0 0; }
.t1 .card-age { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.t1 .card-body { padding: 18px 28px 24px; gap: 20px; }
.t1 .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 24px; }
.t1 .facts .wide { grid-column: span 2; }
.t1 .facts dt { font-size: 11.5px; letter-spacing: .06em; }
.t1 .facts dd { font-size: 13.5px; }
.t1 .act { border-top: 1px solid var(--ink); padding-top: 18px; }
.t1 .act-grid { grid-template-columns: 200px minmax(0, 1fr); }
.t1 #trk { height: 48px; font-size: 20px; font-family: var(--mono); letter-spacing: .04em; border: 1.5px solid var(--ink); }
.t1 #carrier { height: 48px; }
.t1 .btn { border-radius: 3px; }
.t1 .lnk { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.t1 .tbl td.op .btn { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.t1 .act-row .btn.primary { height: 44px; padding: 0 22px; font-size: 14.5px; font-weight: 650; letter-spacing: .03em; }
.t1 .claim { border-left: 3px solid var(--accent); border-radius: 0; background: var(--accent-soft); }
.t1 .empty .ic { color: var(--accent); }
.t1 .st .ic { stroke-width: 2; }
.t1 .st-ship { color: #c2410c; }
.t1 .st-refund { color: #be123c; font-weight: 600; }
.t1 .st-sent { color: #1d4ed8; }
.t1 .st-done { color: #15803d; }
.t1 .st-pay { color: #6b7683; }
.t1 .st-void { color: #9aa3ad; }
.t1 .chip { border-radius: 3px; height: 30px; font-size: 12.5px; }
.t1 .chip b { font-family: var(--mono); }
.t1 .tbl td, .t1 .tbl th { padding-top: 6px; padding-bottom: 6px; }
.t1 .tbl td { font-size: 13px; }
.t1 .tbl-box, .t1 .selbar { border-radius: 3px; }
.t1 .tbl td.num, .t1 .tbl td.nowrap:nth-child(4) { font-family: var(--mono); font-size: 12.5px; }
.t1 .selbar { background: var(--rail); }
.t1 .selbar .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (max-width: 720px) {
  .t1 .qsel { display: grid; grid-template-columns: 1fr 1fr; border-radius: 3px; }
  .t1 .qtab { min-width: 0; padding: 10px 12px; }
  .t1 .qtab .q-count { font-size: 26px; }
  .t1 .qsel-note { padding: 8px 12px; }
  .t1 .card-h { display: block; }
  .t1 .act-grid { grid-template-columns: 1fr; }

function toast(msg) {
  var t = document.getElementById("toast");
  t.innerHTML = ic("circle-check") + "<span>" + esc(msg) + "</span><small>示範，未寫入任何系統</small>";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 4000);
}

var orders = cloneOrders();
var S = { mode: "queue", q: "ship", cur: { ship: null, refund: null, sel: null }, later: {}, touched: { ship: [], refund: [], sel: [] }, selIds: [], status: "", selected: {}, listOpen: false };

document.getElementById("crumbSep").innerHTML = ic("chevron-right");
document.getElementById("searchIc").innerHTML = ic("search");
document.querySelector("[data-mode=queue]").innerHTML = ic("list-todo") + "處理佇列";
document.querySelector("[data-mode=table]").innerHTML = ic("layout-list") + "所有訂單";
document.getElementById("moreBtn").innerHTML = ic("funnel") + "更多條件";

function pendingStatus(q) { return q === "refund" ? "退款中" : "待出貨"; }
// 佇列內容：待處理的依等待時間由舊到新，「稍後處理」排到後面；本次處理過的留在清單底部
function queueItems(q) {
  var base = q === "sel" ? S.selIds.map(function (id) { return byId(orders, id); }) : orders.filter(function (o) { return o.status === pendingStatus(q); });
  var pend = base.filter(function (o) { return o.status === pendingStatus(q); });
  pend.sort(function (a, b) { return (S.later[a.id] || 0) - (S.later[b.id] || 0) || (a.time < b.time ? -1 : 1); });
  var done = S.touched[q].map(function (id) { return byId(orders, id); }).filter(function (o) { return o.status !== pendingStatus(q); });
  return { pend: pend, done: done };
}
function ensureCur(q) {
  var it = queueItems(q), cur = S.cur[q];
  var all = it.pend.concat(it.done);
  if (!cur || !byId(all, cur)) S.cur[q] = it.pend.length ? it.pend[0].id : null;
}
function oldest(list) { return list.length ? ageText(list[0].time) : "—"; }

function renderQsel() {
  var s = queueItems("ship"), r = queueItems("refund");
  var tabs = [
    { q: "ship", icon: "package", name: "待出貨", n: s.pend.length, sub: s.pend.length ? "最舊等了 " + oldest(s.pend) : "已清空" },
    { q: "refund", icon: "undo-2", name: "退款中", n: r.pend.length, sub: r.pend.length ? "最舊等了 " + ageText(REFUNDS[r.pend[0].id].at) : "已清空" }
  ];
  if (S.selIds.length) { var x = queueItems("sel"); tabs.push({ q: "sel", icon: "list-checks", name: "所選訂單", n: x.pend.length, sub: "共 " + S.selIds.length + " 筆，從所有訂單勾選", cls: "sel-q" }); }
  var doneN = S.touched.ship.length + S.touched.refund.length;
  document.getElementById("qsel").innerHTML = tabs.map(function (t) {
    return '<button type="button" role="tab" class="qtab ' + (t.cls || "") + '" data-q="' + t.q + '" aria-selected="' + (S.q === t.q) + '" tabindex="' + (S.q === t.q ? 0 : -1) + '" aria-controls="card">' + ic(t.icon) + '<span class="q-name">' + t.name + '</span><span class="q-sub">' + t.sub + '</span><span class="q-count">' + t.n + "</span></button>";
  }).join("") + '<p class="qsel-note">' + ic("circle-check") + "這次已處理 " + doneN + " 筆</p>";
}
function renderList() {
  var it = queueItems(S.q);
  var rows = it.pend.map(function (o) {
    var sub = S.q === "refund" ? esc(o.customer) + "・" + money(REFUNDS[o.id].amount) + "・" + esc(REFUNDS[o.id].wants) : esc(o.customer) + "・" + esc(o.items);
    var age = S.q === "refund" ? REFUNDS[o.id].at : o.time;
    return '<li><button type="button" class="qi' + (S.later[o.id] ? " later" : "") + '" data-id="' + o.id + '" aria-current="' + (S.cur[S.q] === o.id) + '"><span class="qi-id idf">' + o.id + '</span><span class="qi-age' + (ageDays(age) >= 5 ? " old" : "") + '">' + ic("clock") + ageText(age) + '</span><span class="qi-sub">' + sub + "</span></button></li>";
  }).concat(it.done.map(function (o) {
    return '<li><button type="button" class="qi done" data-id="' + o.id + '" aria-current="' + (S.cur[S.q] === o.id) + '"><span class="qi-id idf">' + o.id + '</span><span class="qi-age qi-done-ic">' + ic("check") + o.status + '</span><span class="qi-sub">' + esc(o.customer) + "</span></button></li>";
  }));
  document.getElementById("qlist").innerHTML = '<div class="qlist-h"><span>依等待時間，舊的在前</span><span>' + it.pend.length + " 筆待處理</span></div><ul class=\"qul\">" + rows.join("") + "</ul>";
  var tg = document.getElementById("qlistToggle");
  tg.innerHTML = ic(S.listOpen ? "chevron-down" : "chevron-right") + (S.listOpen ? "收起佇列" : "顯示佇列中的 " + it.pend.length + " 筆");
  tg.setAttribute("aria-expanded", S.listOpen);
  document.getElementById("qlistBox").classList.toggle("open", S.listOpen);
}
function factsHtml(o, extra) {
  return '<dl class="facts"><div><dt>顧客</dt><dd>' + esc(o.customer) + '</dd></div><div><dt>商品</dt><dd>' + esc(o.items) + '</dd></div><div><dt>金額</dt><dd><span class="num">' + money(o.amount) + "</span>・" + o.pay + "</dd></div>" + (extra || "") + '<div class="wide"><dt>配送</dt><dd>' + o.ship + "<br>" + esc(o.address) + "</dd></div></dl>";
}
function renderCard() {
  var card = document.getElementById("card"), q = S.q, id = S.cur[q];
  if (!id) {
    var other = q === "refund" ? "ship" : "refund", on = queueItems(other).pend.length;
    var name = q === "refund" ? "退款中" : q === "sel" ? "所選訂單" : "待出貨";
    card.innerHTML = '<div class="empty">' + ic("circle-check") + "<h2>" + name + "已清空</h2><p>這個佇列這次處理了 " + S.touched[q].length + " 筆。</p>" + (on ? '<button class="btn primary" type="button" data-goq="' + other + '">' + ic(other === "ship" ? "package" : "undo-2") + "切到" + (other === "ship" ? "待出貨" : "退款中") + "（" + on + "）</button>" : "") + "</div>";
    return;
  }
  var o = byId(orders, id), it = queueItems(q), pos = it.pend.indexOf(o) + 1;
  var head = '<header class="card-h"><div class="card-meta">' + statusBadge(o.status) + (pos ? '<span class="pos">第 ' + pos + " / " + it.pend.length + " 筆</span>" : "") + '</div><h2 class="card-id idf" id="cardId" tabindex="-1">' + o.id + "</h2>";
  var detail = '<a class="lnk" href="#/orders/' + o.id + '">' + ic("file-text") + "訂單明細</a>";
  if (o.status === "待出貨") {
    var cs = o.carrier || carrierFor(o);
    card.innerHTML = head + '<p class="card-age">' + ic("clock") + "已等 " + ageText(o.time) + "（" + o.time.slice(5) + " 下單）</p></header>" +
      '<div class="card-body">' + factsHtml(o) +
      '<form class="act" id="shipForm" novalidate><div class="act-grid">' +
      '<label class="field"><span>物流商</span><select class="inp" id="carrier">' + CARRIERS.map(function (c) { return "<option" + (c === cs ? " selected" : "") + ">" + c + "</option>"; }).join("") + '</select><small class="hint">依配送方式預選</small></label>' +
      '<label class="field"><span>物流單號／寄件代碼</span><input class="inp idf" id="trk" autocomplete="off" aria-describedby="trkErr" placeholder="掃描或輸入"><p class="err" id="trkErr">' + ic("circle-alert") + "請輸入物流單號</p></label></div>" +
      '<div class="act-row"><button class="btn primary" type="submit">' + ic("truck") + "出貨，下一筆</button>" + '<button class="btn" type="button" id="laterBtn">' + ic("skip-forward") + "稍後處理</button>" + detail + "</div>" +
      '<p class="kbd-hint">' + ic("corner-down-left") + "在單號欄按 Enter 就會出貨並換下一筆</p></form></div>";
  } else if (o.status === "退款中") {
    var r = REFUNDS[o.id];
    card.innerHTML = head + '<p class="card-age">' + ic("clock") + "申請已等 " + ageText(r.at) + "（" + r.at.slice(5) + " 申請）</p></header>" +
      '<div class="card-body">' + '<section class="claim"><h3>' + ic("message-square-text") + "顧客的退款申請</h3><blockquote>" + esc(r.reason) + "</blockquote><p>希望：" + esc(r.wants) + "</p></section>" + factsHtml(o, '<div><dt>申請退款</dt><dd><span class="num">' + money(r.amount) + "</span></dd></div>") +
      '<div class="act"><div class="act-row" id="refundRow"><button class="btn primary" type="button" id="approveBtn">' + ic("check") + "核准退款 " + money(r.amount) + '</button><button class="btn" type="button" id="declineBtn" aria-expanded="false" aria-controls="declineBox">' + ic("x") + "婉拒…</button>" + detail + "</div>" +
      '<div id="declineBox" hidden><label class="field"><span>婉拒原因（會寄給顧客）</span><textarea class="inp" id="declineReason" aria-describedby="decErr"></textarea></label><p class="err" id="decErr">' + ic("circle-alert") + '請填寫婉拒原因</p><div class="act-row" style="margin-top:10px"><button class="btn danger" type="button" id="declineSend">送出婉拒，下一筆</button><button class="btn ghost" type="button" id="declineCancel">取消</button></div></div></div></div>';
  } else {
    var res = o.status === "已出貨" ? o.carrier + "・單號 " + esc(o.tracking) : o.status === "已退款" ? "已核准退款 " + money(REFUNDS[o.id].amount) : o.status === "退款已婉拒" ? "原因：" + esc(o.note) : "";
    card.innerHTML = head + '<p class="card-age">' + ic("check") + "這次已處理</p></header>" + '<div class="card-body"><div class="done-line">' + statusBadge(o.status) + "<span>" + res + "</span></div>" + factsHtml(o) + '<div class="act-row">' + detail + "</div></div>";
  }
}
function render() {
  ensureCur(S.q);
  document.querySelectorAll(".mode button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-mode") === S.mode); });
  document.getElementById("queueView").hidden = S.mode !== "queue";
  document.getElementById("tableView").hidden = S.mode !== "table";
  if (S.mode === "queue") { renderQsel(); renderList(); renderCard(); } else renderTable();
}
function nextAfter(q, id) {
  var it = queueItems(q);
  S.cur[q] = it.pend.length ? it.pend[0].id : null;
}
function focusWork() {
  var t = document.getElementById("trk");
  if (t) t.focus(); else { var h = document.getElementById("cardId") || document.querySelector("#card .btn"); if (h) h.focus(); }
}
function touch(q, id) { if (S.touched[q].indexOf(id) < 0) S.touched[q].push(id); if (q === "sel" && S.touched.ship.indexOf(id) < 0) S.touched.ship.push(id); }
function doShip(e) {
  e.preventDefault();
  var trk = document.getElementById("trk"), v = trk.value.trim(), err = document.getElementById("trkErr");
  trk.setAttribute("aria-invalid", !v); err.classList.toggle("show", !v);
  if (!v) { trk.focus(); return; }
  var o = byId(orders, S.cur[S.q]);
  o.status = "已出貨"; o.tracking = v; o.carrier = document.getElementById("carrier").value;
  touch(S.q, o.id); delete S.later[o.id];
  nextAfter(S.q, o.id); render(); focusWork();
  toast(o.id + " 已出貨（" + o.carrier + "）");
}
function decideRefund(approve) {
  var o = byId(orders, S.cur[S.q]);
  if (!approve) {
    var t = document.getElementById("declineReason"), v = t.value.trim();
    t.setAttribute("aria-invalid", !v); document.getElementById("decErr").classList.toggle("show", !v);
    if (!v) { t.focus(); return; }
    o.note = v; o.status = "退款已婉拒";
  } else o.status = "已退款";
  touch("refund", o.id);
  nextAfter("refund", o.id); render(); focusWork();
  toast(o.id + (approve ? " 已核准退款 " + money(REFUNDS[o.id].amount) : " 已婉拒退款"));
}

document.getElementById("card").addEventListener("input", function (e) {
  if (e.target.getAttribute("aria-invalid") === "true" && e.target.value.trim()) { e.target.setAttribute("aria-invalid", "false"); var er = document.getElementById(e.target.getAttribute("aria-describedby")); if (er) er.classList.remove("show"); }
});
document.getElementById("card").addEventListener("submit", function (e) { if (e.target.id === "shipForm") doShip(e); });
document.getElementById("card").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "laterBtn") { var id = S.cur[S.q]; S.later[id] = Date.now(); nextAfter(S.q); if (S.cur[S.q] === id && queueItems(S.q).pend.length > 1) S.cur[S.q] = queueItems(S.q).pend[0].id; render(); focusWork(); toast(id + " 移到佇列最後"); }
  if (b.id === "approveBtn") decideRefund(true);
  if (b.id === "declineBtn") { document.getElementById("declineBox").hidden = false; b.setAttribute("aria-expanded", "true"); document.getElementById("declineReason").focus(); }
  if (b.id === "declineCancel") { document.getElementById("declineBox").hidden = true; document.getElementById("declineBtn").setAttribute("aria-expanded", "false"); document.getElementById("declineBtn").focus(); }
  if (b.id === "declineSend") decideRefund(false);
  if (b.getAttribute("data-goq")) { S.q = b.getAttribute("data-goq"); render(); focusWork(); }
});
document.getElementById("qlist").addEventListener("click", function (e) {
  var b = e.target.closest(".qi"); if (!b) return;
  S.cur[S.q] = b.getAttribute("data-id");
  if (window.matchMedia("(max-width: 720px)").matches) S.listOpen = false;
  render(); focusWork();
});
document.getElementById("qlistToggle").addEventListener("click", function () { S.listOpen = !S.listOpen; renderList(); });
document.getElementById("qsel").addEventListener("click", function (e) {
  var b = e.target.closest(".qtab"); if (!b) return;
  S.q = b.getAttribute("data-q"); render(); document.querySelector('.qtab[data-q="' + S.q + '"]').focus();
});
document.getElementById("qsel").addEventListener("keydown", function (e) {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  var tabs = [].slice.call(document.querySelectorAll(".qtab")), i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  var n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  S.q = n.getAttribute("data-q"); render(); document.querySelector('.qtab[data-q="' + S.q + '"]').focus(); e.preventDefault();
});
document.querySelector(".mode").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  S.mode = b.getAttribute("data-mode"); render();
});

/* 所有訂單：欄位順序與現況相同 */
function tableView() {
  var kw = document.getElementById("kw").value.trim(), pay = document.getElementById("pay").value, from = document.getElementById("from").value, to = document.getElementById("to").value;
  return orders.filter(function (o) {
    if (S.status && o.status !== S.status) return false;
    if (pay && o.pay !== pay) return false;
    if (from && o.time.slice(0, 10) < from) return false;
    if (to && o.time.slice(0, 10) > to) return false;
    if (kw && (o.id + o.customer).indexOf(kw) < 0) return false;
    return true;
  });
}
function renderTable() {
  var c = countBy(orders);
  var sts = STATUS_ORDER.filter(function (s) { return c[s] || ["待付款", "待出貨", "退款中", "已出貨", "已完成", "已取消"].indexOf(s) >= 0; });
  document.getElementById("chips").innerHTML = '<button type="button" class="chip" data-st="" aria-pressed="' + (S.status === "") + '">全部 <b>' + orders.length + "</b></button>" + sts.map(function (s) {
    return '<button type="button" class="chip" data-st="' + s + '" aria-pressed="' + (S.status === s) + '">' + s + " <b>" + (c[s] || 0) + "</b></button>";
  }).join("");
  var v = tableView();
  document.getElementById("rows").innerHTML = v.length ? v.map(function (o) {
    var op = o.status === "待出貨" ? '<button class="btn sm" type="button" data-work="ship" data-id="' + o.id + '">' + ic("truck") + "出貨</button>" : o.status === "退款中" ? '<button class="btn sm" type="button" data-work="refund" data-id="' + o.id + '">' + ic("undo-2") + "處理退款</button>" : "";
    return '<tr><td><input type="checkbox" data-sel="' + o.id + '" aria-label="選取 ' + o.id + '"' + (S.selected[o.id] ? " checked" : "") + '></td><td class="op">' + op + '<a class="lnk" href="#/orders/' + o.id + '">明細</a></td><td class="idf">' + o.id + '</td><td class="nowrap">' + o.time + '</td><td class="nowrap">' + esc(o.customer) + "</td><td>" + esc(o.items) + '</td><td class="num">' + money(o.amount) + '</td><td class="nowrap">' + o.pay + '</td><td class="nowrap">' + o.ship + "</td><td>" + statusBadge(o.status) + "</td></tr>";
  }).join("") : '<tr class="empty-row"><td colspan="10">沒有符合條件的訂單。<button class="btn sm" type="button" id="clearAll">清除篩選</button></td></tr>';
  document.getElementById("foot").textContent = "共 " + v.length + " 筆";
  renderSelbar();
}
function selIdList() { return Object.keys(S.selected).filter(function (k) { return S.selected[k]; }); }
function renderSelbar() {
  var ids = selIdList(), shipN = ids.filter(function (id) { return byId(orders, id).status === "待出貨"; }).length, bar = document.getElementById("selbar");
  bar.classList.toggle("show", ids.length > 0);
  bar.innerHTML = "<span>已選 " + ids.length + " 筆</span>" + '<button class="btn primary" type="button" id="workSel"' + (shipN ? "" : " disabled") + ">" + ic("truck") + "逐筆出貨所選（" + shipN + "）</button>" + '<button class="btn" type="button" data-demo="列印揀貨單">' + ic("printer") + '列印揀貨單</button><button class="btn" type="button" data-demo="匯出 CSV">' + ic("download") + '匯出 CSV</button><button class="btn ghost" type="button" id="selClear">' + ic("x") + "取消選取</button>";
}
document.getElementById("chips").addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (!b) return; S.status = b.getAttribute("data-st"); renderTable(); document.querySelector('.chip[data-st="' + S.status + '"]').focus(); });
["kw", "pay", "from", "to"].forEach(function (id) { document.getElementById(id).addEventListener("input", renderTable); });
document.getElementById("moreBtn").addEventListener("click", function () { var m = document.getElementById("more"), open = !m.classList.contains("show"); m.classList.toggle("show", open); this.setAttribute("aria-expanded", open); });
document.getElementById("clearMore").addEventListener("click", function () { ["pay", "from", "to"].forEach(function (id) { document.getElementById(id).value = ""; }); renderTable(); });
document.getElementById("tableView").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (e.target.matches("input[data-sel]")) { S.selected[e.target.getAttribute("data-sel")] = e.target.checked; renderSelbar(); return; }
  if (e.target.id === "selAll") { tableView().forEach(function (o) { S.selected[o.id] = e.target.checked; }); renderTable(); return; }
  if (!b) return;
  if (b.getAttribute("data-work")) { S.mode = "queue"; S.q = b.getAttribute("data-work"); S.cur[S.q] = b.getAttribute("data-id"); render(); focusWork(); }
  if (b.id === "clearAll") { S.status = ""; document.getElementById("kw").value = ""; ["pay", "from", "to"].forEach(function (id) { document.getElementById(id).value = ""; }); renderTable(); }
  if (b.id === "selClear") { S.selected = {}; document.getElementById("selAll").checked = false; renderTable(); }
  if (b.getAttribute("data-demo")) toast(b.getAttribute("data-demo") + "：已選 " + selIdList().length + " 筆，未產生檔案");
  if (b.id === "workSel") {
    var ids = selIdList(), ok = ids.filter(function (id) { return byId(orders, id).status === "待出貨"; });
    S.selIds = ok; S.touched.sel = []; S.cur.sel = null; S.mode = "queue"; S.q = "sel"; render(); focusWork();
    if (ids.length > ok.length) toast("略過 " + (ids.length - ok.length) + " 筆非待出貨的訂單");
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !document.getElementById("declineBox")?.hidden) { var c = document.getElementById("declineCancel"); if (c) c.click(); } });

var P = new URLSearchParams(location.search);
if (P.get("mode")) S.mode = P.get("mode");
if (P.get("q")) S.q = P.get("q");
if (P.get("t") && !document.body.className.trim()) document.body.className = "t" + P.get("t");
render();
</script>
</body>
</html>
