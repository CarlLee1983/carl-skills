<title>方向 B 表格內就地處理｜訂單（示例）</title>
<style>
/* 共用頁首與左側導覽：沿用現況，改善範圍不含這一塊 */
.lg-top { position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(#3b5f93, #2a4775); color: #fff; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 30; border-bottom: 1px solid #1d3354; }
.lg-logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; }
.lg-logo small { font-weight: normal; font-size: 12px; margin-left: 8px; opacity: .8; }
.lg-sample { font-size: 11px; background: #f6d860; color: #4a3b00; padding: 1px 6px; border-radius: 2px; }
.lg-user { margin-left: auto; font-size: 12px; }
.lg-user a { color: #cfe0ff; }
.lg-menu { display: none; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; }
.lg-nav { position: fixed; top: 46px; bottom: 0; left: 0; width: 168px; background: #e9edf3; border-right: 1px solid #c3cad6; padding-top: 8px; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 25; }
.lg-nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; color: #2b3a52; text-decoration: none; border-bottom: 1px solid #d8dee8; }
.lg-nav a.on { background: #fff; font-weight: bold; color: #1d4f91; border-left: 4px solid #1d4f91; padding-left: 10px; }
.lg-nav a:hover { background: #f7f9fc; }
.lg-glyph { width: 16px; text-align: center; font-size: 12px; }
.lg-main { margin-left: 168px; padding-top: 46px; min-height: 100vh; }
@media (max-width: 800px) {
  .lg-menu { display: block; }
  .lg-logo small, .lg-user { display: none; }
  .lg-nav { transform: translateX(-100%); transition: transform .2s; }
  .lg-nav-open .lg-nav { transform: none; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
  .lg-main { margin-left: 0; }
}

/* 方向比較用的中性樣式：結構先比，視覺語言留到選定方向之後 */
:root {
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #f4f5f7; --surface: #fff; --sunken: #f8f9fa;
  --line: #e1e4e8; --line-strong: #c8cdd3;
  --ink: #1f2933; --ink-2: #4b5563; --ink-3: #7b8592;
  --accent: #2459c4; --accent-ink: #fff; --accent-soft: #eaf0fb;
  --danger: #b42318;
  --radius: 6px; --fs: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pg { padding: 20px 24px 64px; max-width: 1400px; }
.crumb { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; margin-bottom: 4px; }
.crumb a { color: inherit; text-decoration: none; }
.crumb a:hover { color: var(--ink); text-decoration: underline; }
.crumb .ic { width: 14px; height: 14px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 650; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--danger); }
.lnk { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.lnk:hover { text-decoration: underline; }
.st { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--ink-2); }
.st .ic { width: 15px; height: 15px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.inp { height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); width: 100%; }
textarea.inp { height: auto; padding: 8px 10px; min-height: 72px; resize: vertical; }
.inp:focus-visible { outline-offset: 0; }
.inp[aria-invalid=true] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; display: none; align-items: center; gap: 4px; margin: 0; }
.err.show { display: flex; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.idf { font-family: var(--mono); font-size: .93em; letter-spacing: -.01em; white-space: nowrap; }
.sample-note { color: var(--ink-3); font-size: 12px; margin-top: 16px; }

/* 表格：欄位順序沿用現況 */
.tbl-wrap { overflow-x: auto; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; min-width: 940px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 8px 8px; border-bottom: 1px solid var(--line-strong); background: var(--sunken); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 7px 8px; font-size: 13.5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: #fafbfc; }
.tbl td.op { white-space: nowrap; }
.tbl td.op .btn + .lnk { margin-left: 6px; }
.tbl td.op .btn, .tbl td.op .lnk { vertical-align: middle; }
.tbl td.nowrap { white-space: nowrap; }
.tbl td:nth-child(6) { min-width: 170px; }
.tbl input[type=checkbox] { width: 16px; height: 16px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; background: #1f2933; color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); transition: opacity .18s, transform .18s; z-index: 80; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast small { color: #b9c2cc; margin-left: 4px; white-space: nowrap; }
@media (max-width: 720px) {
  .pg { padding: 14px 16px 64px; }
  #toast { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.pg-head { margin-bottom: 14px; }
.todo { display: flex; align-items: stretch; gap: 0; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.todo-label { display: flex; align-items: center; gap: 8px; padding: 0 18px; font-weight: 600; color: var(--ink-2); background: var(--sunken); border-right: 1px solid var(--line); }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border: 0; border-right: 1px solid var(--line); background: none; cursor: pointer; text-align: left; }
.todo-item:hover { background: var(--sunken); }
.todo-item[aria-pressed=true] { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.todo-item .n { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 1.2em; }
.todo-item .t { display: grid; }
.todo-item .t b { font-weight: 600; }
.todo-item .t small { color: var(--ink-3); font-size: 12.5px; }
.todo-done { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 18px; color: var(--ink-3); font-size: 13px; }
.cols { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.filter { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 14px; }
.filter fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.filter legend { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; padding: 0; }
.filter .ck { display: flex; align-items: center; gap: 8px; }
.filter .ck b { margin-left: auto; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
.filter-toggle { display: none; }
.tbl-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tbl-foot { padding: 8px 12px; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); }
tr.open td { background: var(--accent-soft) !important; }
tr.xp td { background: #fbfcfe; padding: 0; border-bottom: 2px solid var(--accent); }
.xp-in { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 14px 16px 16px 60px; position: sticky; left: 0; max-width: min(100vw - 40px, 1100px); }
.xp-in .field { min-width: 0; }
.xp-in .err { flex-basis: 100%; }
.xp-claim { flex-basis: 100%; display: grid; gap: 2px; }
.xp-claim small { color: var(--ink-3); }
.xp-claim q { font-size: 15px; }
.xp-in .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.selbar { position: sticky; bottom: 12px; margin-top: 12px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--ink); color: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 10; }
.selbar.show { display: flex; }
.selbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.selbar .btn.primary { background: #fff; color: var(--ink); border-color: #fff; }
.selbar .btn.ghost { border-color: transparent; }
.selbar :focus-visible { outline-color: #fff; }
.empty-row td { text-align: center; padding: 32px; color: var(--ink-3); }
@media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr); } .filter-toggle { display: flex; } .filter { display: none; } .filter.open { display: grid; } }
@media (max-width: 720px) {
  .crumb { display: none; }
  .todo-label { display: none; }
  .todo-item { flex: 1 1 50%; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .todo-done { padding: 8px 12px; margin: 0; }
  .xp-in { padding: 12px; max-width: calc(100vw - 34px); }
  .xp-in .field { flex: 1 1 100%; }
}
</style>
</head>

<header class="lg-top">
  <button class="lg-menu" type="button" aria-label="選單" onclick="document.body.classList.toggle('lg-nav-open')">

  </button>
  <span class="lg-logo">小巷選物<small>商家管理後台</small></span>
  <span class="lg-sample">示例資料</span>
  <span class="lg-user">客服 小周 ｜ <a href="#/logout">登出</a></span>
</header>
<nav class="lg-nav" aria-label="後台導覽">
  <a href="#/dashboard"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 0.5 7.5H2.5V15H6.5V10.5H9.5V15H13.5V7.5H15.5Z" fill="currentColor"/></svg>首頁</a>
  <a href="#/orders" class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>訂單管理</a>
  <a href="#/products"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0.5 15 4v8l-7 3.5L1 12V4Z" fill="currentColor"/><path d="M1 4l7 3.5L15 4M8 7.5V15.5" stroke="#fff" stroke-width="1" fill="none"/></svg>商品管理</a>
  <a href="#/customers"><span class="lg-glyph" aria-hidden="true">▸</span>顧客名單</a>
  <a href="#/reports"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 21h18M6 17V10M11 17V5M16 17v-8M21 17v-4"/></svg>報表</a>
  <a href="#/settings"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><circle cx="8" cy="8" r="2.6" fill="#e9edf3"/></svg>系統設定</a>
</nav>

<main class="lg-main">
<div class="pg">
  <div class="pg-head">
    <nav class="crumb" aria-label="麵包屑"><a href="#/dashboard">首頁</a><span class="sep"></span><span>訂單管理</span></nav>
    <h1>訂單列表</h1>
  </div>
  <div class="todo" id="todo"></div>
  <div class="cols">
    <button class="btn filter-toggle" type="button" id="filterToggle" aria-expanded="false" aria-controls="filter"></button>
    <form class="filter" id="filter" aria-label="篩選條件">
      <fieldset><legend>訂單狀態</legend><div id="stList" style="display:grid;gap:6px"></div></fieldset>
      <label class="field"><span>付款方式</span><select class="inp" name="pay"><option value="">全部</option><option>信用卡</option><option>ATM 轉帳</option><option>LINE Pay</option><option>貨到付款</option></select></label>
      <label class="field"><span>下單日期起</span><input class="inp" type="date" name="from"></label>
      <label class="field"><span>下單日期迄</span><input class="inp" type="date" name="to"></label>
      <label class="field"><span>關鍵字</span><input class="inp" name="kw" placeholder="訂單編號或顧客姓名"></label>
      <div style="display:flex;gap:8px"><button class="btn primary" type="submit" id="qBtn"></button><button class="btn" type="button" id="clearBtn">清除</button></div>
    </form>
    <section>
      <div class="tbl-box">
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th><input type="checkbox" id="selAll" aria-label="全選目前列表"></th><th>操作</th><th>訂單編號</th><th>下單時間</th><th>顧客</th><th>商品</th><th>金額</th><th>付款方式</th><th>配送方式</th><th>狀態</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="tbl-foot" id="foot"></div>
      </div>
      <div class="selbar" id="selbar" role="region" aria-label="已選取的訂單"></div>
    </section>
  </div>
  <p class="sample-note">示例：25 筆虛構訂單；出貨、退款與篩選都只改寫這個頁面的記憶體。</p>
</div>
</main>

});
document.getElementById("rows").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { var x = e.target.closest("[data-xp]"); if (x) { var id = x.getAttribute("data-xp"); delete open[id]; render(); var b = document.querySelector('[data-open="' + id + '"]'); if (b) b.focus(); } }
});
document.getElementById("rows").addEventListener("click", function (e) {
  if (e.target.matches("input[data-sel]")) { selected[e.target.getAttribute("data-sel")] = e.target.checked; renderSelbar(); return; }
  var b = e.target.closest("button"); if (!b) return;
  var id;
  if ((id = b.getAttribute("data-open"))) { open[id] = !open[id]; render(); if (open[id]) focusXp(id); else document.querySelector('[data-open="' + id + '"]').focus(); }
  if ((id = b.getAttribute("data-close"))) { delete open[id]; render(); document.querySelector('[data-open="' + id + '"]').focus(); }
  if ((id = b.getAttribute("data-approve"))) { var o = byId(orders, id); o.status = "已退款"; delete open[id]; doneN++; render(); toast(id + " 已核准退款 " + money(REFUNDS[id].amount)); }
  if ((id = b.getAttribute("data-decline"))) { var d = b.closest(".xp-in").querySelector(".dec"); d.hidden = false; b.setAttribute("aria-expanded", "true"); d.querySelector("textarea").focus(); }
  if ((id = b.getAttribute("data-decsend"))) {
    var box = b.closest(".xp-in"), t = box.querySelector("textarea"), v = t.value.trim();
    t.setAttribute("aria-invalid", !v); box.querySelector(".dec .err").classList.toggle("show", !v);
    if (!v) { t.focus(); return; }
    var o2 = byId(orders, id); o2.status = "退款已婉拒"; o2.note = v; delete open[id]; doneN++; render(); toast(id + " 已婉拒退款");
  }
  if (b.id === "clearAll") { document.getElementById("filter").reset(); readForm(); render(); }
});
document.getElementById("selAll").addEventListener("change", function () { var c = this.checked; view.forEach(function (o) { selected[o.id] = c; }); render(); });
document.getElementById("selbar").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.id === "selClear") { selected = {}; document.getElementById("selAll").checked = false; render(); }
  if (b.getAttribute("data-demo")) toast(b.getAttribute("data-demo") + "：已選 " + selIds().length + " 筆，未產生檔案");
  if (b.id === "batchOpen") { var first; selIds().forEach(function (id) { if (byId(orders, id).status === "待出貨") { open[id] = true; first = first || id; } }); render(); focusXp(view.filter(function (o) { return open[o.id]; })[0].id); }
});
document.getElementById("todo").addEventListener("click", function (e) {
  var b = e.target.closest(".todo-item"); if (!b) return;
  var s = b.getAttribute("data-st"), on = b.getAttribute("aria-pressed") === "true";
  applied = { st: on ? [] : [s], pay: "", from: "", to: "", kw: "" };
  document.getElementById("filter").reset(); render(); document.querySelector('.todo-item[data-st="' + s + '"]').focus();
});
document.getElementById("filter").addEventListener("submit", function (e) { e.preventDefault(); readForm(); render(); });
document.getElementById("clearBtn").addEventListener("click", function () { document.getElementById("filter").reset(); readForm(); render(); });
document.getElementById("filterToggle").addEventListener("click", function () { var f = document.getElementById("filter"), o = !f.classList.contains("open"); f.classList.toggle("open", o); this.setAttribute("aria-expanded", o); });
var P = new URLSearchParams(location.search);
if (P.get("st")) applied.st = [P.get("st")];
if (P.get("open")) open[P.get("open")] = true;
render();
</script>
</body>
</html>
