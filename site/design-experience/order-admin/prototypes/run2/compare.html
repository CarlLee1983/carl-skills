.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 12px 18px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar h1 { font-size: 15px; margin: 0; font-weight: 650; }
.bar h1 small { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid #c8cdd3; border-radius: 6px; padding: 2px; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font: inherit; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-selected=true] { background: var(--ink); color: #fff; }
.side-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.notes-btn { display: none; margin-left: auto; align-items: center; gap: 6px; border: 1px solid #c8cdd3; background: #fff; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.stage { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; background: #c8cdd3; min-height: 0; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: #fff; }
.pane[hidden] { display: none; }
.pane-h { font-size: 12px; font-weight: 600; padding: 4px 10px; background: #f6f7f9; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.pane iframe { width: 100%; height: 100%; border: 0; display: block; }
.notes { background: #fff; border-left: 1px solid var(--line); overflow: auto; padding: 16px 18px 32px; }
.notes h2 { margin: 0 0 4px; font-size: 18px; }
.notes .concept { margin: 0 0 14px; color: var(--ink-2); }
.notes h3 { font-size: 12.5px; color: var(--ink-3); margin: 14px 0 4px; font-weight: 600; letter-spacing: .02em; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 2px 0; }
.pid { display: inline-block; font-weight: 600; font-size: 12px; padding: 0 6px; border-radius: 4px; background: #e8eefb; color: var(--accent); margin-right: 4px; }
.pid.no { background: #f1f2f4; color: var(--ink-3); text-decoration: line-through; }
.meter { display: flex; gap: 3px; margin-top: 2px; }
.meter i { width: 22px; height: 6px; border-radius: 3px; background: #e1e4e8; }
.meter i.on { background: var(--ink); }
.rec { margin-top: 16px; padding: 12px 14px; background: #f6f7f9; border-radius: 8px; }
.rec b { display: flex; align-items: center; gap: 6px; }
.tasks { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .notes { display: none; border-left: 0; border-bottom: 1px solid var(--line); max-height: 55vh; }
  .notes.open { display: block; }
  .notes-btn { display: inline-flex; }
  .side-toggle { display: none; }
  .stage { grid-row: 2; }
}
@media (max-width: 520px) { .bar { padding: 8px 12px; } .bar h1 small { display: none; } .seg button { padding: 5px 9px; } }

  A: { file: "a.html", title: "A 最小修補", concept: "留在現況的骨架裡，只修兩個高嚴重度問題。",
    solves: ["P1", "P2"], open: ["P3", "P4", "P5"],
    how: ["側欄狀態多了「退款中」，每個狀態都標筆數（P1）", "三層對話框收成一個：物流商依配送方式預選，焦點直接進單號欄（P2）", "退款的處理仍在明細頁，這個方向不碰"],
    relearn: 1, relearnText: "幾乎沒有：出貨從三個視窗變一個。",
    stays: "側欄篩選與「查詢」、表格欄位順序、批次列位置、路由 #/orders、共用導覽。",
    cost: ["清空 8 筆待出貨要開關 8 次視窗，每次重新找下一列", "退款還是要進明細頁處理", "開發量：小"] },
  B: { file: "b.html", title: "B 表格內就地處理", concept: "表格仍是工作台；上方「今日待辦」帶到兩條佇列，出貨與退款直接在列內展開完成。",
    solves: ["P1", "P2", "P4"], partial: ["P5"], open: ["P3"],
    how: ["「今日待辦」兩格：待出貨、退款中，各帶筆數與最舊等了多久，點了就只看那一種（P1）", "出貨在列下方展開：物流商預選、輸入單號後按 Enter，會自動展開下一筆待出貨（P2）", "勾選後的操作列固定在畫面底部，捲到哪都在（P4）", "退款在列內看申請原因，直接核准或填原因婉拒", "390 寬仍是表格橫捲，狀態欄還在最右（P5 只改善了待辦入口）"],
    relearn: 2, relearnText: "中：出貨不再跳視窗，改在列下方展開；「今日待辦」是新入口。",
    stays: "側欄篩選與「查詢」、表格欄位順序、路由 #/orders、共用導覽。",
    cost: ["展開列會讓表格高度跳動，處理中的列在長表格裡容易被推出畫面", "列內空間有限，退款原因只能放一段引言", "需要「退款申請內容」的讀取契約（原因、希望的處理、申請時間）", "開發量：中"] },
  C: { file: "c.html", title: "C 處理佇列", concept: "預設畫面改成兩條待辦佇列，一次處理一筆、完成就換下一筆；表格退到「所有訂單」。",
    solves: ["P1", "P2", "P4", "P5"], open: ["P3"],
    how: ["待出貨、退款中是兩條佇列，等最久的排最前，筆數就是「還剩多少」（P1）", "右側工作卡列出出貨需要的一切；輸入單號按 Enter 就出貨並換下一筆，不用回表格找（P2）", "在所有訂單勾選後按「逐筆出貨所選」，所選訂單變成一條臨時佇列（P4）", "390 寬直接是工作卡，狀態在卡片頂端，不必橫捲（P5）", "退款卡片完整列出顧客的申請原因與希望的處理，再核准或婉拒"],
    relearn: 3, relearnText: "高：進訂單管理先看到佇列而不是表格；找特定訂單要切到「所有訂單」。",
    stays: "路由 #/orders、共用導覽；「所有訂單」的表格欄位順序與付款方式、日期、關鍵字條件（收進上方條件列）。",
    cost: ["預設檢視改變，客服的掃表習慣要換成處理佇列，第一週會慢", "佇列排序（等最久優先）是產品決策，要和組長確認", "需要「退款申請內容」的讀取契約", "開發量：中到大（新檢視＋既有表格調整）"] }
};
var ORDER = ["現況", "A", "B", "C"], cur = "C", side = false;
var stage = document.getElementById("stage");
ORDER.forEach(function (k) {
  var p = document.createElement("section"); p.className = "pane"; p.id = "pane-" + k; p.hidden = true;
  p.innerHTML = '<div class="pane-h">' + D[k].title + "</div>";
  var f = document.createElement("iframe"); f.title = D[k].title + "（示例原型）"; f.src = D[k].file; p.appendChild(f);
  stage.appendChild(p);
});
document.getElementById("seg").innerHTML = ORDER.map(function (k) { return '<button type="button" role="tab" data-k="' + k + '">' + D[k].title + "</button>"; }).join("");
document.getElementById("notesBtn").innerHTML = ic("info") + "說明";
function pids(list, cls) { return (list || []).map(function (p) { return '<span class="pid ' + (cls || "") + '">' + p + "</span>"; }).join(""); }
function meter(n) { return '<div class="meter" aria-label="重新學習程度 ' + n + ' / 3">' + [1, 2, 3].map(function (i) { return "<i" + (i <= n ? ' class="on"' : "") + "></i>"; }).join("") + "</div>"; }
function renderNotes() {
  var d = D[cur], h = "<h2>" + d.title + '</h2><p class="concept">' + d.concept + "</p>";
  if (cur === "現況") {
    h += "<p>" + d.note + "</p><h3>問題清單</h3><ul>" + d.probs.map(function (p) { return "<li>" + pids([p[0]]) + p[1] + "</li>"; }).join("") + "</ul>";
  } else {
    h += "<h3>解決的問題</h3><div>" + pids(d.solves) + (d.partial ? pids(d.partial) + "<small>（部分）</small>" : "") + "</div>" +
      (d.open.length ? "<h3>沒有處理</h3><div>" + pids(d.open, "no") + (d.open.indexOf("P3") >= 0 ? "<small> P3 留給視覺處理階段</small>" : "") + "</div>" : "") +
      "<h3>怎麼做</h3><ul>" + d.how.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" +
      "<h3>重新學習</h3>" + meter(d.relearn) + "<p style=\"margin:4px 0 0\">" + d.relearnText + "</p>" +
      "<h3>保持不變</h3><p style=\"margin:0\">" + d.stays + "</p>" +
      "<h3>代價</h3><ul>" + d.cost.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    if (cur === "C") h += '<div class="rec"><b>' + ic("circle-check") + "設計師建議：C</b>客服每天約四小時做的是清空待出貨、處理退款中。C 讓每一筆變成「看卡片、輸入單號、Enter」，還剩幾筆一直看得到。重新學習只付一次，換來每天重複的省時。如果客服其實常要跨狀態比對訂單，就改選 B。</div>";
  }
  h += '<div class="tasks"><h3>試做任務（每個方向都一樣）</h3><ol style="margin:0;padding-left:18px"><li>把待出貨清到 0（單號隨意輸入）</li><li>找到王志明的退款申請並處理</li><li>找出謝欣怡的訂單 SO-261019-0113</li></ol></div>';
  document.getElementById("notes").innerHTML = h;
}
function render() {
  document.querySelectorAll("#seg button").forEach(function (b) { var on = b.getAttribute("data-k") === cur; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  var wide = window.matchMedia("(min-width: 901px)").matches;
  ORDER.forEach(function (k) { document.getElementById("pane-" + k).hidden = !(k === cur || (side && wide && k === "現況")); });
  stage.prepend(document.getElementById("pane-現況"));
  renderNotes();
}
document.getElementById("seg").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; cur = b.getAttribute("data-k"); render(); });
document.getElementById("seg").addEventListener("keydown", function (e) {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  var i = ORDER.indexOf(cur); cur = ORDER[(i + (e.key === "ArrowRight" ? 1 : ORDER.length - 1)) % ORDER.length]; render();
  document.querySelector('#seg [data-k="' + cur + '"]').focus(); e.preventDefault();
});
document.getElementById("side").addEventListener("change", function () { side = this.checked; render(); });
document.getElementById("notesBtn").addEventListener("click", function () { var n = document.getElementById("notes"), o = !n.classList.contains("open"); n.classList.toggle("open", o); this.setAttribute("aria-expanded", o); });
window.addEventListener("resize", render);
var P = new URLSearchParams(location.search);
if (P.get("v") && D[P.get("v")]) cur = P.get("v");
if (P.get("side")) { side = true; document.getElementById("side").checked = true; }
render();
</script>
