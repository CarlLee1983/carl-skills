<style>
/* 共用頁首與左側導覽：沿用現況，改善範圍不含這一塊 */
.lg-top { position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(#3b5f93, #2a4775); color: #fff; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 30; border-bottom: 1px solid #1d3354; }
.lg-logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; }
.lg-logo small { font-weight: normal; font-size: 12px; margin-left: 8px; opacity: .8; }
.lg-sample { font-size: 11px; background: #f6d860; color: #4a3b00; padding: 1px 6px; border-radius: 2px; }
.lg-user { margin-left: auto; font-size: 12px; }
.lg-user a { color: #cfe0ff; }
.lg-menu { display: none; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; }
.lg-nav { position: fixed; top: 46px; bottom: 0; left: 0; width: 168px; background: #e9edf3; border-right: 1px solid #c3cad6; padding-top: 8px; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 25; }
.lg-nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; color: #2b3a52; text-decoration: none; border-bottom: 1px solid #d8dee8; }
.lg-nav a.on { background: #fff; font-weight: bold; color: #1d4f91; border-left: 4px solid #1d4f91; padding-left: 10px; }
.lg-nav a:hover { background: #f7f9fc; }
.lg-glyph { width: 16px; text-align: center; font-size: 12px; }
.lg-main { margin-left: 168px; padding-top: 46px; min-height: 100vh; }
@media (max-width: 800px) {
  .lg-menu { display: block; }
  .lg-logo small, .lg-user { display: none; }
  .lg-nav { transform: translateX(-100%); transition: transform .2s; }
  .lg-nav-open .lg-nav { transform: none; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
  .lg-main { margin-left: 0; }
}

body { margin: 0; background: #f2f4f7; color: #333; font: 12px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; }
.gk-wrap { padding: 12px 16px 40px; }

.gk-fbody { padding: 8px; }

.gk-fbody label { display: block; margin: 3px 0; }

.gk-table-area { flex: 1; min-width: 0; background: #fff; border: 1px solid #c9d0db; }
.gk-batch { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f7f8fa; border-bottom: 1px solid #c9d0db; flex-wrap: wrap; }
.gk-batch .count { color: #555; margin-right: 6px; }
.gk-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 1000px; }
th { background: linear-gradient(#f4f6f9, #e1e6ee); border: 1px solid #c9d0db; padding: 5px 6px; text-align: left; font-weight: bold; color: #2b3a52; white-space: nowrap; }
td { border: 1px solid #e1e5eb; padding: 5px 6px; vertical-align: top; }
tr:nth-child(even) td { background: #f8f9fb; }
td.op { white-space: nowrap; }
td.op a { color: #2a5ba8; margin-left: 4px; }
td.num { text-align: right; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
/* P3：狀態只靠灰階深淺區分 */
.st-待付款 { color: #9a9a9a; }
.st-待出貨 { color: #5a5a5a; }
.st-已出貨 { color: #6e6e6e; }
.st-已完成 { color: #333; }
.st-已取消 { color: #b8b8b8; }
.st-退款中 { color: #808080; }
.gk-pager { padding: 6px 8px; color: #555; border-top: 1px solid #c9d0db; }
/* P2：三層巢狀對話框 */
.gk-overlay { position: fixed; inset: 0; background: rgba(40,50,70,.35); z-index: 50; display: none; }
.gk-overlay.show { display: block; }
.gk-dlg { position: fixed; z-index: 60; width: 380px; max-width: calc(100vw - 40px); background: #fff; border: 1px solid #5d6b80; box-shadow: 2px 3px 10px rgba(0,0,0,.35); display: none; }

.gk-dlg .t { background: linear-gradient(#5d87c4, #3a649f); color: #fff; padding: 5px 8px; font-weight: bold; display: flex; justify-content: space-between; }
.gk-dlg .t button { background: none; border: 0; color: #fff; cursor: pointer; font-size: 13px; }
.gk-dlg .b { padding: 10px; line-height: 1.7; }
.gk-dlg .f { padding: 8px 10px; border-top: 1px solid #ddd; text-align: right; background: #f4f6f9; }
.gk-dlg .err { color: #c00; display: none; }
.gk-dlg .err.show { display: block; }

#dlg1 { left: calc(50% - 190px); top: 120px; }
#dlg2 { left: calc(50% - 160px); top: 160px; }
#dlg3 { left: calc(50% - 130px); top: 200px; }
@media (max-width: 800px) {

  .gk-cols { display: block; }

  .gk-filter h2 { display: none; }
  .gk-fbody { display: none; }
  .gk-filter.open .gk-fbody { display: block; }

<main class="lg-main">
<div class="gk-wrap">
  <div class="gk-crumb"><a href="#/dashboard">首頁</a> &gt; <a href="#/orders">訂單管理</a> &gt; 訂單列表</div>
  <h1>訂單列表</h1>
  <div class="gk-msg" id="msg" role="status"></div>
  <div class="gk-cols">
    <aside class="gk-filter" id="filter">
      <h2>篩選條件</h2>
      <button class="gk-toggle" type="button" onclick="this.parentNode.classList.toggle('open')">篩選條件 ▼</button>
      <form class="gk-fbody" id="ff" onsubmit="applyFilter(event)">
        <fieldset><legend>訂單狀態</legend>
          <label><input type="checkbox" name="st" value="待付款"> 待付款</label>
          <label><input type="checkbox" name="st" value="待出貨"> 待出貨</label>
          <label><input type="checkbox" name="st" value="已出貨"> 已出貨</label>
          <label><input type="checkbox" name="st" value="已完成"> 已完成</label>
          <label><input type="checkbox" name="st" value="已取消"> 已取消</label>
        </fieldset>
        <fieldset><legend>付款方式</legend>
          <select name="pay"><option value="">-- 全部 --</option><option>信用卡</option><option>ATM 轉帳</option><option>LINE Pay</option><option>貨到付款</option></select>
        </fieldset>
        <fieldset><legend>下單日期</legend>
          <input type="text" name="from" placeholder="YYYY-MM-DD"> 至<br><input type="text" name="to" placeholder="YYYY-MM-DD">
        </fieldset>
        <fieldset><legend>關鍵字</legend>
          <input type="text" name="kw" placeholder="訂單編號／顧客姓名">
        </fieldset>
        <button class="gk-btn primary" type="submit">查詢</button>
        <button class="gk-btn" type="button" onclick="clearFilter()">清除</button>
      </form>
    </aside>
    <section class="gk-table-area">
      <div class="gk-batch" id="batch">
        <span class="count" id="selCount">已選取 0 筆</span>
        <button class="gk-btn" type="button" onclick="batchShip()">批次出貨</button>
        <button class="gk-btn" type="button" onclick="flash('列印揀貨單：示範，未產生任何檔案')">列印揀貨單</button>
        <button class="gk-btn" type="button" onclick="flash('匯出 CSV：示範，未產生任何檔案')">匯出 CSV</button>
      </div>
      <div class="gk-scroll">
        <table>
          <thead><tr><th><input type="checkbox" aria-label="全選" onclick="selAll(this)"></th><th>操作</th><th>訂單編號</th><th>下單時間</th><th>顧客</th><th>商品</th><th>金額</th><th>付款方式</th><th>配送方式</th><th>狀態</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="gk-pager" id="pager"></div>
    </section>
  </div>
</div>
</main>

function render() {
  document.getElementById("rows").innerHTML = view.map(function (o) {
    var op = (o.status === "待出貨" ? '<button class="gk-btn sm" type="button" data-ship="' + o.id + '">出貨</button>' : "") + '<a href="#/orders/' + o.id + '">明細</a>';
    return '<tr><td><input type="checkbox" aria-label="選取 ' + o.id + '" data-sel="' + o.id + '"' + (selected[o.id] ? " checked" : "") + '></td><td class="op">' + op + '</td><td class="nowrap">' + o.id + '</td><td class="nowrap">' + o.time + '</td><td class="nowrap">' + escHtml(o.customer) + '</td><td>' + escHtml(o.items) + '</td><td class="num">' + money(o.amount) + '</td><td class="nowrap">' + o.pay + '</td><td class="nowrap">' + o.ship + '</td><td class="nowrap st-' + o.status + '">' + o.status + '</td></tr>';
  }).join("");
  document.getElementById("pager").textContent = "共 " + view.length + " 筆　第 1 / 1 頁　每頁 50 筆";
  updateSel();
}
function updateSel() { document.getElementById("selCount").textContent = "已選取 " + Object.keys(selected).filter(function (k) { return selected[k]; }).length + " 筆"; }
document.getElementById("rows").addEventListener("click", function (e) {
  var s = e.target.getAttribute("data-ship"); if (s) startShip(s);
  var c = e.target.getAttribute("data-sel"); if (c) { selected[c] = e.target.checked; updateSel(); }
});
function selAll(cb) { view.forEach(function (o) { selected[o.id] = cb.checked; }); render(); }
function applyFilter(e) {
  if (e) e.preventDefault();
  var f = document.getElementById("ff"), sts = [].slice.call(f.querySelectorAll("input[name=st]:checked")).map(function (i) { return i.value; });
  var pay = f.pay.value, from = f.from.value.trim(), to = f.to.value.trim(), kw = f.kw.value.trim();
  view = orders.filter(function (o) {
    if (sts.length && sts.indexOf(o.status) < 0) return false;
    if (pay && o.pay !== pay) return false;
    if (from && o.time.slice(0, 10) < from) return false;
    if (to && o.time.slice(0, 10) > to) return false;
    if (kw && (o.id + o.customer).indexOf(kw) < 0) return false;
    return true;
  });
  render();
}
function clearFilter() { document.getElementById("ff").reset(); view = orders.slice(); render(); }
function flash(t) { var m = document.getElementById("msg"); m.textContent = t; m.classList.add("show"); window.scrollTo(0, 0); }
function batchShip() {
  var n = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
  flash(n ? "批次出貨：已選 " + n + " 筆，請逐筆開啟出貨視窗填寫物流單號（示範）" : "請先勾選訂單");
}
function startShip(id) {
  current = orders.filter(function (o) { return o.id === id; })[0];
  document.getElementById("d1b").innerHTML = "訂單編號：" + current.id + "<br>顧客：" + escHtml(current.customer) + "<br>商品：" + escHtml(current.items) + "<br>配送方式：" + current.ship + "<br>收件地址：" + escHtml(current.address) + "<br><br>確定要將此訂單出貨嗎？";
  [].forEach.call(document.querySelectorAll("input[name=carrier]"), function (r) { r.checked = false; });
  document.getElementById("trk").value = "";
  document.getElementById("ov").classList.add("show");
  openDlg(1);
}
function openDlg(n) {
  document.getElementById("dlg" + n).classList.add("show");
  var b = document.querySelector("#dlg" + n + " .f .primary"); if (b) b.focus();
}
function backTo(n) { for (var i = n + 1; i <= 3; i++) document.getElementById("dlg" + i).classList.remove("show"); }
function toStep3() {
  var r = document.querySelector("input[name=carrier]:checked");
  document.getElementById("d2err").classList.toggle("show", !r);
  if (!r) return;
  document.getElementById("d3c").textContent = r.value;
  openDlg(3); document.getElementById("trk").focus();
}
function doShip() {
  var t = document.getElementById("trk").value.trim();
  document.getElementById("d3err").classList.toggle("show", !t);
  if (!t) return;
  current.status = "已出貨"; current.tracking = t;
  closeAll(); applyFilter();
  flash("訂單 " + current.id + " 已出貨（示範：未寫入任何系統）");
}
function closeAll() { [1, 2, 3].forEach(function (n) { document.getElementById("dlg" + n).classList.remove("show"); }); document.getElementById("ov").classList.remove("show"); document.getElementById("d2err").classList.remove("show"); document.getElementById("d3err").classList.remove("show"); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });
render();
var q = new URLSearchParams(location.search);
if (q.get("ship")) { startShip(q.get("ship")); if (q.get("step") >= 2) { document.querySelector("input[name=carrier][value='黑貓宅急便']").checked = true; openDlg(2); } if (q.get("step") >= 3) toStep3(); }
</script>
</body>
</html>
