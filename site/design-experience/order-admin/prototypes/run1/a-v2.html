<!doctype html>
<html lang="zh-Hant-TW">
<head>

<title>訂單列表 A・處理 1・v2</title>
<style>
/* 共用頁首與左側導覽：沿用現況，改善範圍不含這一塊 */
.lg-top { position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(#3b5f93, #2a4775); color: #fff; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 30; border-bottom: 1px solid #1d3354; }
.lg-logo { font-weight: bold; font-size: 15px; letter-spacing: 1px; }
.lg-logo small { font-weight: normal; font-size: 12px; margin-left: 8px; opacity: .8; }
.lg-sample { font-size: 11px; background: #f6d860; color: #4a3b00; padding: 1px 6px; border-radius: 2px; }
.lg-user { margin-left: auto; font-size: 12px; }
.lg-user a { color: #cfe0ff; }
.lg-menu { display: none; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; }
.lg-nav { position: fixed; top: 46px; bottom: 0; left: 0; width: 168px; background: #e9edf3; border-right: 1px solid #c3cad6; padding-top: 8px; font: 13px Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; z-index: 25; }
.lg-nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; color: #2b3a52; text-decoration: none; border-bottom: 1px solid #d8dee8; }
.lg-nav a.on { background: #fff; font-weight: bold; color: #1d4f91; border-left: 4px solid #1d4f91; padding-left: 10px; }
.lg-nav a:hover { background: #f7f9fc; }
.lg-glyph { width: 16px; text-align: center; font-size: 12px; }
.lg-main { margin-left: 168px; padding-top: 46px; min-height: 100vh; }
@media (max-width: 800px) {
  .lg-menu { display: block; }
  .lg-logo small, .lg-user { display: none; }
  .lg-nav { transform: translateX(-100%); transition: transform .2s; }
  .lg-nav-open .lg-nav { transform: none; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
  .lg-main { margin-left: 0; }
}

/* 改善提案：訂單頁內容區。頁首與左側導覽沿用現況（shell.css） */
:root {
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --bg: #f4f5f7; --surface: #fff; --line: #d9dde3; --line-soft: #eceef1;
  --ink: #1f2933; --ink-2: #4b5563; --ink-3: #6b7280;
  --accent: #2f5d8a; --accent-ink: #fff; --accent-soft: #e8eff6;
  --danger: #b42318; --focus: #2563eb;
  --fs: 14px; --row: 44px; --radius: 6px; --shadow: none;
}
/* 處理 1「清晰帳本」：密、平、等寬數字，狀態用色彩加形狀 */
.t1 { --bg: #f6f6f4; --line: #dcdcd6; --line-soft: #ebebe6; --ink: #1c1f23; --accent: #1f3a5f; --accent-soft: #e7ecf3; --fs: 13px; --row: 38px; --radius: 3px; }
/* 處理 2「標籤看板」：寬鬆、卡片有層次，狀態用標籤加圖示 */
.t2 { --bg: #eef1f4; --line: #dfe3e8; --line-soft: #edf0f3; --accent: #0f6b66; --accent-soft: #e3f2f0; --fs: 14px; --row: 52px; --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); }

body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/1.5 var(--font); }
.t1 body, body.t1 { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.t2 .ic { stroke-width: 2; }
.t1 .ic, .t0 .ic { stroke-width: 1.75; }

.pg { padding: 16px 16px 48px; max-width: 1400px; }
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.crumb { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 12px; }
.crumb a { color: var(--ink-3); text-decoration: none; }
.crumb .ic { width: 12px; height: 12px; }
.pg-head h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
.t1 .pg-head h1 { font-size: 18px; }
.ver { font-size: 12px; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 4px; padding: 2px 8px; background: var(--surface); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: start; }
.side, .main { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.t2 .side, .t2 .main { border-color: transparent; }
.side { padding: 4px 0 12px; }
.side-toggle { display: none; }
.side h2 { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 12px 14px 6px; letter-spacing: .04em; }
.fld { padding: 0 14px; margin-bottom: 10px; }
.fld label.lb { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.fld input[type=text], .fld input[type=date], .fld select { width: 100%; box-sizing: border-box; height: 34px; border: 1px solid var(--line); border-radius: calc(var(--radius) - 1px); padding: 0 8px; background: #fff; }
.t1 .fld input, .t1 .fld select { height: 30px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.side-actions { display: flex; gap: 8px; padding: 4px 14px 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: calc(var(--radius) - 1px); background: var(--surface); cursor: pointer; white-space: nowrap; }
.t1 .btn { height: 28px; padding: 0 10px; }
.t2 .btn { height: 36px; padding: 0 14px; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 28px; padding: 0 10px; }
.t2 .btn.sm { height: 32px; }

/* 結構 A：表格上方的狀態分頁 */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 12px 12px 10px; border: 0; background: none; border-bottom: 2px solid transparent; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab .oldest { display: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.m-search { display: none; }
.tab[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tab .n { font-size: 12px; color: var(--ink-3); background: var(--line-soft); border-radius: 10px; padding: 0 7px; font-weight: 400; }
.tab[aria-selected=true] .n { background: var(--accent-soft); color: var(--accent); }

/* 結構 B：側欄的已存篩選 */
.saved { list-style: none; margin: 0; padding: 0 6px; }
.saved button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 0; background: none; border-radius: calc(var(--radius) - 1px); cursor: pointer; text-align: left; }
.saved button:hover { background: var(--line-soft); }
.saved button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.saved .n { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.saved-add { margin: 4px 14px 0; }
.chips { display: none; }
.active-filter { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
.active-filter b { color: var(--ink); }

.batch { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.batch .count { color: var(--ink-3); margin-right: 4px; font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 980px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 0 8px; height: var(--row); border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tbody tr:hover td { background: #fafbfc; }
td.op { white-space: nowrap; }
td.op a { color: var(--accent); margin-left: 6px; font-size: 13px; }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.nowrap { white-space: nowrap; }
td.items { color: var(--ink-2); min-width: 120px; }
.t2 td { padding: 0 7px; }
.t2 td.op .btn { padding: 0 8px; height: 32px; }
td.op .btn { padding: 0 8px; }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-3); }
.pager { padding: 10px 12px; color: var(--ink-3); font-size: 12px; }

/* 狀態呈現：處理 0（中性，P3 尚未處理）、1（色彩加形狀）、2（標籤加圖示） */
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mk { width: 10px; height: 10px; flex: none; }
.t1 .st { font-weight: 500; }
.t1 .s-待付款 { color: #526070; } .t1 .s-待出貨 { color: #a3470b; } .t1 .s-退款中 { color: #b4183c; }
.t1 .s-已出貨 { color: #1d4fbf; } .t1 .s-已完成 { color: #166c39; } .t1 .s-已取消 { color: #6b7280; }
.t1 tr.row-退款中 td:first-child { box-shadow: inset 3px 0 0 #b4183c; }
.t2 .st { padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.t2 .st .ic { width: 14px; height: 14px; }
.t2 .s-待付款 { background: #eef2f6; color: #44505e; } .t2 .s-待出貨 { background: #fff1e0; color: #8f3a07; }
.t2 .s-退款中 { background: #ffe9ec; color: #a8122f; } .t2 .s-已出貨 { background: #e6efff; color: #1d4fbf; }
.t2 .s-已完成 { background: #e3f6ea; color: #146333; } .t2 .s-已取消 { background: #f0f1f3; color: #5f6672; }

/* 出貨側邊面板（P2） */
.scrim { position: fixed; inset: 0; background: rgba(15,23,42,.28); z-index: 70; opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--surface); z-index: 80; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(15,23,42,.14); transform: translateX(100%); transition: transform .2s ease-out; visibility: hidden; }
.drawer.show { transform: none; visibility: visible; }
.dr-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dr-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dr-head .sub { color: var(--ink-3); font-size: 12px; }
.dr-head .x { margin-left: auto; }
.dr-body { flex: 1; overflow-y: auto; padding: 16px; }
.dr-sec { margin-bottom: 18px; }
.dr-sec h3 { font-size: 12px; color: var(--ink-3); font-weight: 600; margin: 0 0 6px; letter-spacing: .04em; }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.dr-body .fld { padding: 0; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.err { font-size: 12px; color: var(--danger); margin-top: 4px; display: none; align-items: center; gap: 4px; }
.err.show { display: flex; }
input.invalid { border-color: var(--danger) !important; }
.dr-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.bl { list-style: none; margin: 0; padding: 0; }
.bl li { border: 1px solid var(--line); border-radius: calc(var(--radius) - 1px); padding: 10px; margin-bottom: 8px; }
.bl .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.bl .skip { color: var(--ink-3); font-size: 13px; }
.sim { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--ink-3); background: var(--line-soft); border-radius: 4px; padding: 6px 8px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1f2933; color: #fff; border-radius: 8px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 90; max-width: calc(100vw - 32px); box-sizing: border-box; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .btn { height: 28px; background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }

@media (prefers-reduced-motion: reduce) { .drawer, .scrim, .toast { transition: none; } }

@media (max-width: 900px) {
  .layout { display: block; }
  .side { margin-bottom: 12px; padding: 0; }
  .side-toggle { display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; padding: 0 14px; border: 0; background: none; cursor: pointer; font-weight: 600; }
  .side-toggle .ic:last-child { margin-left: auto; }
  .side-body { display: none; padding-bottom: 12px; }
  .side.open .side-body { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .chips button { flex: none; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; }
  .chips button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
}
@media (max-width: 640px) {
  .pg { padding: 12px 12px 40px; }
  .ver { display: none; }
  .drawer { width: 100%; }
  /* 窄螢幕把關鍵字搜尋放在最上面，其餘條件收在「篩選條件」 */
  .m-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink-3); }
  .m-search input { flex: 1; border: 0; height: 40px; background: none; color: var(--ink); min-width: 0; }
  .m-search input:focus-visible { outline: none; }
  .m-search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* 窄螢幕的分頁：mt-stack（a-v1 以前）直列成清單；mt-scroll（a-v2）收成單列橫向捲動 */
  .mt-stack .tabs { flex-direction: column; padding: 4px 0; gap: 0; }
  .mt-stack .tab { justify-content: space-between; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); border-left: 3px solid transparent; }
  .mt-stack .tab[aria-selected=true] { border-bottom-color: var(--line-soft); border-left-color: var(--accent); background: var(--accent-soft); }
  .mt-stack .tab { min-height: 72px; }
  .mt-stack .tab .lbl { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .mt-stack .tab .oldest { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .mt-scroll .tabs { overflow-x: auto; scroll-snap-type: x proximity; padding: 0 4px; scrollbar-width: none; }
  .mt-scroll .tabs::-webkit-scrollbar { display: none; }
  .mt-scroll .tab { scroll-snap-align: start; padding: 10px 10px 8px; }
  .mt-scroll .tabs-wrap { position: relative; }
  .mt-scroll .tabs-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 1px; width: 28px; background: linear-gradient(to right, rgba(255,255,255,0), var(--surface)); pointer-events: none; }
}


</style>

    if (state.side.kw) desc.push("關鍵字：" + escHtml(state.side.kw));
    $("af").innerHTML = ic("funnel") + (state.saved != null ? "<b>" + escHtml(saved[state.saved].name) + "</b>" : "") + (desc.length ? desc.join("　") : "顯示全部訂單");
  }
  function syncForm() {
    var f = $("sideBody");
    f.pay.value = state.side.pay; f.from.value = state.side.from; f.to.value = state.side.to; f.kw.value = state.side.kw; $("mKw").value = state.side.kw;
    [].forEach.call(f.querySelectorAll("input[name=st]"), function (c) { c.checked = state.side.st.indexOf(c.value) >= 0; });
  }
  function readForm() {
    var f = $("sideBody");
    return { st: [].slice.call(f.querySelectorAll("input[name=st]:checked")).map(function (c) { return c.value; }), pay: f.pay.value, from: f.from.value, to: f.to.value, kw: f.kw.value.trim() };
  }
  function clearAll() { state.side = { st: [], pay: "", from: "", to: "", kw: "" }; state.saved = null; state.tab = "全部"; syncForm(); render(); }

  $("sideBody").addEventListener("submit", function (e) { e.preventDefault(); state.side = readForm(); state.saved = null; render(); });
  $("clr").addEventListener("click", clearAll);
  $("mSearch").addEventListener("submit", function (e) { e.preventDefault(); state.side.kw = $("mKw").value.trim(); syncForm(); render(); });
  $("side").querySelector(".side-toggle").addEventListener("click", function () { var o = $("side").classList.toggle("open"); this.setAttribute("aria-expanded", o); });
  if (cfg.s === "B") {
    $("saveCur").addEventListener("click", function () {
      var f = readForm(), name = prompt("為目前的篩選取個名稱（示範：只存在這個分頁）", "我的篩選");
      if (!name) return;
      saved.push({ name: name.trim().slice(0, 20), f: f }); state.side = f; state.saved = saved.length - 1; render();
    });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-saved],[data-ship],[data-sel],[data-stub],#emptyClr,#all,#bShip");
    if (!t) return;
    if (t.dataset.tab) { state.tab = t.dataset.tab; render(); var b = document.querySelector('[data-tab="' + state.tab + '"]'); b.focus(); if (cfg.mt === "scroll") b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    else if (t.dataset.saved != null) { var i = +t.dataset.saved; state.saved = i; state.side = Object.assign({ st: [], pay: "", from: "", to: "", kw: "" }, saved[i].f); syncForm(); render(); }
    else if (t.dataset.ship) openShip([t.dataset.ship], t);
    else if (t.dataset.sel) { state.sel[t.dataset.sel] = t.checked; render(); }
    else if (t.dataset.stub) toast(t.dataset.stub + "：示範按鈕，未產生任何檔案", null);
    else if (t.id === "emptyClr") clearAll();
    else if (t.id === "all") { visible().forEach(function (o) { state.sel[o.id] = t.checked; }); render(); }
    else if (t.id === "bShip") {
      var ids = Object.keys(state.sel).filter(function (k) { return state.sel[k]; });
      if (!ids.length) toast("請先勾選要出貨的訂單", null); else openShip(ids, t);
    }
  });
  $("tabs") && $("tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var tabs = ["全部"].concat(STATUSES), i = tabs.indexOf(state.tab) + (e.key === "ArrowRight" ? 1 : -1);
    state.tab = tabs[(i + tabs.length) % tabs.length]; render(); document.querySelector('[data-tab="' + state.tab + '"]').focus();
  });

  // 出貨：一個側邊面板取代三層對話框。物流商依訂單既有的配送方式預選
  function carrierOf(o) { return o.ship.indexOf("7-ELEVEN") >= 0 ? "7-ELEVEN 交貨便" : o.ship.indexOf("全家") >= 0 ? "全家店到店" : o.ship.indexOf("新竹") >= 0 ? "新竹物流" : "黑貓宅急便"; }
  function carrierSelect(o, idx) {
    return '<select id="car' + idx + '" aria-label="物流商">' + ["黑貓宅急便", "新竹物流", "7-ELEVEN 交貨便", "全家店到店"].map(function (c) { return "<option" + (c === carrierOf(o) ? " selected" : "") + ">" + c + "</option>"; }).join("") + "</select>";
  }
  function openShip(ids, trigger) {
    lastFocus = trigger || null;
    var list = ids.map(function (id) { return orders.filter(function (o) { return o.id === id; })[0]; });
    var ship = list.filter(function (o) { return o.status === "待出貨"; }), skip = list.filter(function (o) { return o.status !== "待出貨"; });
    var single = ids.length === 1 && ship.length === 1, o = ship[0], d = $("drawer"), body;
    if (single) {
      body = '<div class="dr-sec"><h3>訂單</h3><dl class="kv"><dt>顧客</dt><dd>' + escHtml(o.customer) + "</dd><dt>商品</dt><dd>" + escHtml(o.items) + "</dd><dt>金額</dt><dd>" + money(o.amount) + "（" + o.pay + "）</dd><dt>配送</dt><dd>" + o.ship + "</dd><dt>收件</dt><dd>" + escHtml(o.address) + "</dd></dl></div>" +
        '<div class="dr-sec"><h3>物流</h3><div class="fld"><label class="lb" for="car0">物流商</label>' + carrierSelect(o, 0) + '<div class="hint">依顧客選的配送方式預選</div></div>' +
        '<div class="fld"><label class="lb" for="trk0">物流單號</label><input type="text" id="trk0" data-trk="' + o.id + '" autocomplete="off" placeholder="掃描或輸入單號">' +
        '<div class="err" id="err0">' + ic("triangle-alert") + "請輸入物流單號</div></div>" +
        '<label class="chk"><input type="checkbox" id="prt" checked> 同時列印出貨單</label></div>';
    } else {
      body = '<div class="dr-sec"><h3>要出貨的訂單（' + ship.length + "）</h3>" + (ship.length ? '<ul class="bl">' + ship.map(function (x, i) {
        return '<li><div class="top"><b>' + x.id + "</b><span>" + escHtml(x.customer) + "・" + x.ship + '</span></div><div class="fld"><label class="lb" for="trk' + i + '">物流單號（' + carrierOf(x) + '）</label><input type="text" id="trk' + i + '" data-trk="' + x.id + '" autocomplete="off"><div class="err" id="err' + i + '">' + ic("triangle-alert") + "請輸入物流單號</div></div></li>";
      }).join("") + "</ul>" : '<p class="bl skip">勾選的訂單都不是待出貨。</p>') + "</div>" +
        (skip.length ? '<div class="dr-sec"><h3>略過（不是待出貨）</h3><p class="bl skip">' + skip.map(function (x) { return x.id + "（" + x.status + "）"; }).join("、") + "</p></div>" : "");
    }
    d.innerHTML = '<div class="dr-head">' + ic("truck") + '<div><h2 id="drTitle">' + (single ? "出貨 " + o.id : "批次出貨") + '</h2><div class="sub">確認後訂單改為「已出貨」</div></div><button class="btn ghost sm x" type="button" id="drX" aria-label="關閉">' + ic("x") + "</button></div>" +
      '<form class="dr-body" id="drForm" novalidate>' + body + '<div class="sim">' + ic("info") + "<span>原型示範：確認後只更新這個頁面上的示例資料，不會通知顧客或呼叫物流系統。</span></div></form>" +
      '<div class="dr-foot"><button class="btn" type="button" id="drCancel">取消</button><button class="btn primary" type="submit" form="drForm" id="drOk"' + (ship.length ? "" : " disabled") + ">" + ic("check") + (single ? "確認出貨" : "確認出貨 " + ship.length + " 筆") + "</button></div>";
    d.classList.add("show"); $("scrim").classList.add("show");
    $("drX").onclick = $("drCancel").onclick = closeShip; $("scrim").onclick = closeShip;
    $("drForm").onsubmit = function (e) {
      e.preventDefault();
      var ok = true, inputs = [].slice.call(d.querySelectorAll("[data-trk]"));
      inputs.forEach(function (inp, i) { var bad = !inp.value.trim(); inp.classList.toggle("invalid", bad); inp.setAttribute("aria-invalid", bad); $("err" + i).classList.toggle("show", bad); if (bad && ok) { inp.focus(); ok = false; } });
      if (!ok) return;
      var before = inputs.map(function (inp) { var x = orders.filter(function (y) { return y.id === inp.dataset.trk; })[0]; var prev = { o: x, status: x.status, tracking: x.tracking }; x.status = "已出貨"; x.tracking = inp.value.trim(); delete state.sel[x.id]; return prev; });
      closeShip(); render();
      toast((before.length === 1 ? before[0].o.id + " 已標記為已出貨" : before.length + " 筆訂單已標記為已出貨") + "（示範，未寫入任何系統）", function () { before.forEach(function (p) { p.o.status = p.status; p.o.tracking = p.tracking; }); render(); });
    };
    var first = d.querySelector("[data-trk]") || $("drOk"); setTimeout(function () { first.focus(); }, 30);
  }
  function closeShip() { $("drawer").classList.remove("show"); $("scrim").classList.remove("show"); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("drawer").classList.contains("show")) closeShip();
    if (e.key === "Tab" && $("drawer").classList.contains("show")) {
      var f = [].slice.call($("drawer").querySelectorAll("button:not([disabled]),input,select")), a = document.activeElement;
      if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  var toastTimer;
  function toast(msg, undo) {
    $("toastMsg").textContent = msg; undoFn = undo; $("toastUndo").style.display = undo ? "" : "none";
    $("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, 6000);
  }
  $("toastUndo").addEventListener("click", function () { if (undoFn) undoFn(); undoFn = null; $("toast").classList.remove("show"); });

  render();
  if (cfg.tab) { state.tab = cfg.tab; render(); }
  if (cfg.ship) openShip([cfg.ship], null);
  window.__app = { state: state, orders: orders };
}
function appConfig(defaults) {
  var q = new URLSearchParams(location.search), c = Object.assign({ s: "A", t: 0, mt: "stack" }, defaults);
  if (q.get("s")) c.s = q.get("s"); if (q.get("t")) c.t = +q.get("t"); if (q.get("mt")) c.mt = q.get("mt");
  if (q.get("ship")) c.ship = q.get("ship"); if (q.get("tab")) c.tab = q.get("tab"); if (q.get("label")) c.label = q.get("label");
  return c;
}


startApp(appConfig({"s":"A","t":1,"mt":"scroll","label":"v2"}));
</script>
</body>
</html>
