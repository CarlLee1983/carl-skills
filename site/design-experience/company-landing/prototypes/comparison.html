  <header><a class="brand" href="../"><img src="assets/mark.svg" width="32" height="32" alt=""><span>序間<small>視覺處理對照</small></span></a><h1>同一家公司，<br>兩種被記住的方式。</h1><p>服務、概念案例與詢問流程相同。原版以作品建立判斷依據；新版把「從混亂到清楚」做成首屏裡會發生的事。</p><a class="button primary" href="shijian-v3.html">體驗新版</a><a class="text-button" href="shijian.html">開啟原版</a></header>
